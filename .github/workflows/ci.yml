name: CI

# Offline eval + frontend build run automatically on every push/PR (free, no API).
# The live eval is MANUAL only (Actions tab -> Run workflow) because it calls the
# model and costs credits — it needs an OPENROUTER_API_KEY repository secret.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  offline-eval:
    name: Offline eval (golden regression, no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline eval (golden through guardrails + time + pages + invariants + extraction)
        run: python -m evals.run_eval
      # The golden proves a GOOD doc passes; this proves each gate FIRES on the defect it
      # was added for (analogy placement, worked-example share, figure realism, coverage
      # map, page ceiling) plus the patcher and assembly guarantees. Also free, no API.
      - name: Run gate regression (each deterministic gate fires on its own defect)
        run: python -m evals.test_gates
      # Output delivery: a reviewer once lost an hour because Download and Create
      # Google Doc both failed on a finished doc. Boots the API and exercises the real
      # endpoints, including recovery when the instance disk has lost the file.
      - name: Run output-delivery regression (download / preview / recovery)
        run: python -m evals.test_outputs
      # Curriculum ORDER: inserting at the top must produce session 1, not 35, and the
      # renumber must reach the database in a fixed handful of statements rather than
      # one per session. The second half is the part a cloud DB cares about: the
      # per-row version held an interactive transaction open across ~34 round trips and
      # Turso reclaimed the stream mid-way ("stream not found"), so inserting a session
      # failed outright while the deck mirror failed silently.
      - name: Run curriculum-order regression (insert / delete / renumber / deck mirror)
        run: python -m evals.test_curriculum_order
      # WHO CAN SEE WHOSE COURSE. Every individual user could see every course on the
      # instance: visibility was "on a team -> that team's courses, on no team ->
      # everything", and nothing recorded who had created a course. Boots the API and
      # drives four real users against it — what each is offered, and what each is
      # allowed to open, edit, generate against and download. Free, no API key.
      - name: Run course-scoping regression (visibility, access, team ownership, deletion)
        run: python -m evals.test_course_scoping
      # The edits a reviewer makes DURING guided review: splitting a slide in two (and the
      # document-wide renumbering and coverage remap that has to follow it), and a note
      # marked "apply to every chunk after this one". The split's correctness is checked
      # against the REAL guardrails on the assembled document, not just field by field.
      - name: Run review-edit regression (slide split + renumbering + standing notes)
        run: python -m evals.test_review_edits
      # THE DECK STORE IS SCOPED BY COURSE. It was one directory keyed by session number,
      # so two courses that both had a session 7 shared one file, and the "already taught"
      # block and the repetition guardrail read across courses. Covers the store, the
      # readers, and the one-time migration out of the flat layout — including the case
      # where ownership cannot be inferred and must not be guessed.
      - name: Run deck-store regression (course scoping + legacy migration)
        run: python -m evals.test_course_decks
      # A slide's content could be text, bullets or a table and nothing else, so a course
      # about code could not put code on a slide. Adding the block is the easy half; this
      # covers the half that matters — that the PAGE ceiling measures code as code (one
      # line per line, monospace, not wrapped like prose), that the recording model
      # charges a line a beat rather than its word count, and that the prose/bullet mix
      # gate reads a walkthrough as the slide's prose.
      - name: Run code-block regression (rendering + page/time measurement + gates)
        run: python -m evals.test_code_block
      # PER-COURSE CONFIGURATION. What a good doc looks like was one set of numbers for
      # every course, several of them plainly about Computer Networks (the market
      # platforms, a slide-role vocabulary with nothing for a code walkthrough, one prose
      # density for every subject). Covers the whitelist, the two rules that are not
      # about shape — a course may raise the bar but never lower it, and a new slide role
      # must come with its analogy rule — and the regression that matters most: a course
      # with no profile grades exactly as the instance did before.
      - name: Run course-profile regression (per-course config + inherit-unchanged)
        run: python -m evals.test_course_profile
      # COURSE SKILLS — the instructions a course is written under, authored and approved.
      # The two properties that carry the weight: a DRAFT must not reach generation (or
      # the approval step is theatre), and a skill must never leak into another course.
      # Also covers path B's traceability rule — a draft the model could not tie back to
      # the author's own words is discarded rather than offered for approval.
      - name: Run course-skills regression (authoring, approval, scoping, provenance)
        run: python -m evals.test_course_skills
      # A skill that is only prose in a prompt is unenforceable. The ones carrying a
      # check are settled deterministically, and this covers the closed vocabulary, the
      # rule that a DRAFT's check must not fire, and the requirement that a failure
      # QUOTES the skill it came from. Also the single parameterised eval dimension that
      # scores skill adherence for any course.
      - name: Run skill-enforcement regression (checks fire, drafts do not)
        run: python -m evals.test_skill_enforcement
      # THE SKILL SYSTEM itself: what a skill is, where it applies, and the one property
      # everything else rests on — a skill says HOW to teach and must NEVER appear in the
      # document as WHAT is taught. Covers the four categories, one-skill-many-
      # instructions (the author's grouping and ordering survive), course/session/global
      # scope, the precedence order, and the leak gate in both directions: it catches a
      # brief printed as bullets, and it leaves ordinary content that merely uses the
      # same words alone — a gate that fires on correct documents is worse than no gate.
      - name: Run skill-system regression (categories, scope, precedence, no leaks)
        run: python -m evals.test_skill_system
      # PREREQUISITE COURSES. "Already taught" meant earlier sessions of THIS course, so
      # a React course whose learners have done JavaScript had no way to say so. The
      # property this guards is the distinction: a prior session's topic may not be
      # re-taught, a prerequisite's may be REFERENCED — and prerequisite topics must stay
      # out of the deterministic repetition lookup, or a doc is failed for building on
      # exactly what it was told to build on.
      - name: Run prerequisite regression (assumed knowledge vs prior sessions)
        run: python -m evals.test_prerequisites
      # …and the ordinary case: a prerequisite taught SOMEWHERE ELSE, known to this agent
      # only through its slides. Its decks live inside the course that declared it, which
      # is the trap this guards — a careless reader would treat them as that course's own
      # prior sessions and fail a slide for building on exactly what it was told to.
      - name: Run external-prerequisite regression (decks with no course of their own)
        run: python -m evals.test_external_prereq

  frontend-build:
    name: Frontend build + committed-bundle check (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Builds AND checks the result against what is committed in frontend/dist. That
      # second half is the point: frontend/dist is committed and is what the deployed
      # instance serves (render.yaml runs pip install only — nothing rebuilds the
      # bundle on deploy), so a green "it compiles" said nothing about whether the
      # bundle people are actually running is this source. It was not, for weeks: the
      # curriculum insert button kept numbering new rows 35 at the top of a 34-session
      # course after both server.py and App.jsx had been fixed.
      - name: Build, and verify the committed bundle matches the source
        run: frontend/scripts/verify-dist.sh

  live-eval:
    name: Live eval (generates + judges, uses API) — manual only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live eval (needs OPENROUTER_API_KEY secret)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set — add it in Settings → Secrets → Actions."
            exit 1
          fi
          # The learning loop first: it is a handful of cheap distillation calls and it
          # proves reviewer feedback still becomes a durable rule. A silent break there
          # looks exactly like "the model ignored my feedback again".
          python -m evals.test_learning_loop
          python -m evals.run_eval --live
