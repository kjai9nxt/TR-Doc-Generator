name: CI

# Offline eval + frontend build run automatically on every push/PR (free, no API).
# The live eval is MANUAL only (Actions tab -> Run workflow) because it calls the
# model and costs credits — it needs an OPENROUTER_API_KEY repository secret.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  offline-eval:
    name: Offline eval (golden regression, no API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline eval (golden through guardrails + time + pages + invariants + extraction)
        run: python -m evals.run_eval
      # The golden proves a GOOD doc passes; this proves each gate FIRES on the defect it
      # was added for (analogy placement, worked-example share, figure realism, coverage
      # map, page ceiling) plus the patcher and assembly guarantees. Also free, no API.
      - name: Run gate regression (each deterministic gate fires on its own defect)
        run: python -m evals.test_gates
      # Output delivery: a reviewer once lost an hour because Download and Create
      # Google Doc both failed on a finished doc. Boots the API and exercises the real
      # endpoints, including recovery when the instance disk has lost the file.
      - name: Run output-delivery regression (download / preview / recovery)
        run: python -m evals.test_outputs
      # Curriculum ORDER: inserting at the top must produce session 1, not 35, and the
      # renumber must reach the database in a fixed handful of statements rather than
      # one per session. The second half is the part a cloud DB cares about: the
      # per-row version held an interactive transaction open across ~34 round trips and
      # Turso reclaimed the stream mid-way ("stream not found"), so inserting a session
      # failed outright while the deck mirror failed silently.
      - name: Run curriculum-order regression (insert / delete / renumber / deck mirror)
        run: python -m evals.test_curriculum_order
      # WHO CAN SEE WHOSE COURSE. Every individual user could see every course on the
      # instance: visibility was "on a team -> that team's courses, on no team ->
      # everything", and nothing recorded who had created a course. Boots the API and
      # drives four real users against it — what each is offered, and what each is
      # allowed to open, edit, generate against and download. Free, no API key.
      - name: Run course-scoping regression (visibility, access, team ownership, deletion)
        run: python -m evals.test_course_scoping
      # The edits a reviewer makes DURING guided review: splitting a slide in two (and the
      # document-wide renumbering and coverage remap that has to follow it), and a note
      # marked "apply to every chunk after this one". The split's correctness is checked
      # against the REAL guardrails on the assembled document, not just field by field.
      - name: Run review-edit regression (slide split + renumbering + standing notes)
        run: python -m evals.test_review_edits

  frontend-build:
    name: Frontend build + committed-bundle check (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Builds AND checks the result against what is committed in frontend/dist. That
      # second half is the point: frontend/dist is committed and is what the deployed
      # instance serves (render.yaml runs pip install only — nothing rebuilds the
      # bundle on deploy), so a green "it compiles" said nothing about whether the
      # bundle people are actually running is this source. It was not, for weeks: the
      # curriculum insert button kept numbering new rows 35 at the top of a 34-session
      # course after both server.py and App.jsx had been fixed.
      - name: Build, and verify the committed bundle matches the source
        run: frontend/scripts/verify-dist.sh

  live-eval:
    name: Live eval (generates + judges, uses API) — manual only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live eval (needs OPENROUTER_API_KEY secret)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set — add it in Settings → Secrets → Actions."
            exit 1
          fi
          # The learning loop first: it is a handful of cheap distillation calls and it
          # proves reviewer feedback still becomes a durable rule. A silent break there
          # looks exactly like "the model ignored my feedback again".
          python -m evals.test_learning_loop
          python -m evals.run_eval --live
