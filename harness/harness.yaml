              budget stops gating acceptance (db.create_run was hardcoded True there too, so the
              dashboard mislabelled guided runs). (b) Draft ranking (pipeline._score_key) no longer
              demotes an over-budget draft when the limit is OFF (report carries time_enforced).
              (c) depth_mode.md now EXPLICITLY overrides HARD RULE 1 (the 40-minute ceiling) instead
              of only implying it. (d) Eval-set LLM scorers get the depth-mode note so they do not
              penalise length; run_eval invariants skip the time + 12-slide ceiling when the limit is
              off. (e) One prompt builder for both modes: context_builder.time_mode_block()."
    - "1.22 — GUIDED RUNS SURVIVE A RESTART (bug: 'Unknown guided session' killed a run mid-review
              and threw away every generated chunk). Guided state lived ONLY in the server process,
              but a guided run spans a long human review during which the app makes no requests —
              long enough for a free host to spin the instance down, or a redeploy/restart to land.
              (a) New guided_sessions table + db.save_guided/load_guided/delete_guided/purge_guided;
              the run is checkpointed after every mutation (per chunk, so a restart costs at most the
              chunk in flight) and rehydrated on demand (_guided_require/_guided_rehydrate): Session
              objects rebuilt from session_no, base_context restored (no KB re-sync), an interrupted
              generation resumed from the last saved chunk, an interrupted regenerate/finalize reset
              to 'reviewing'. Stale checkpoints purged at startup (>72h). (b) The UI keeps the guided
              id in localStorage and offers Resume/Discard for an unfinished run; a truly dead run
              (kind='guided_gone') now clears itself instead of leaving a red dead-end. (c) Two
              latent DB bugs found while fixing this: `.env` was loaded LAZILY, so db.init() created
              the schema on one backend while post-auth requests used the other — server.py now calls
              config.load_env() (renamed from _load_dotenv) BEFORE db.init(); and a set
              TURSO_DATABASE_URL with libsql-experimental missing made _connect() raise inside every
              best-effort try/except, so all tracking writes vanished silently — db now falls back to
              local SQLite with a printed warning."
    - "1.23 — THE SELF-EVOLUTION LOOP ACTUALLY CLOSES, and a failed review step no longer kills a
              guided run. Three reported bugs, two root causes.
              (a) 'Regenerate does nothing' + 'Create final TR Doc does nothing': _guided_regenerate
              and _guided_finalize set status='error' on ANY exception, which is TERMINAL — the UI
              hides the review panel for it, so the chunks (one paid LLM call each) became
              unreachable and neither button could be clicked again. But nothing was broken except
              one LLM call: logs/llm_debug.log shows truncated/unparseable JSON happening regularly.
              Both steps now return to 'reviewing' with a non-fatal `last_error` shown INSIDE the
              panel, chunks intact, retry by clicking again (_guided_step_failed). status='error'
              is reserved for the generate-all phase. A truncated CHUNK is also retried once with a
              concision nudge (a whole-doc truncation still isn't — it would truncate identically).
              Frontend: busyAction released in finally() so a hung request can't leave every review
              button disabled; chunks stay visible on error; the double-regenerate 409 race is
              blocked; stale errors cleared on retry.
              (b) 'It ignores my feedback and repeats the same mistake': four separate breaks.
              1. DISTIL — record_feedback stored the reason VERBATIM, so a hurried deictic note
              ('remove analogy from this') was injected into later sessions where 'this' means
              nothing. Human feedback now goes through distill_feedback() (typos inferred, deictics
              stripped); the original wording is kept in the rule's `raw` field.
              2. DEDUPE — dedup was exact-text only, so the same request typed three ways became
              three rules that diluted the block and evicted older ones. The distil call now gets
              the existing rules and folds a restatement into one of them (hits++), with a
              keyword-overlap VETO because the model would otherwise merge unrelated rules.
              3. INJECT — the rules sat at the tail of the USER prompt under a soft 'LEARNED
              PREFERENCES' header while the system prompt declared 'HARD RULES (a violation fails
              the run)', so any conflict was resolved against the reviewer. They now go in the
              SYSTEM prompt as a separate UNCACHED block (llm._system_blocks keeps the big static
              prefix cached), declare precedence over the style/field guidance, and system_prompt.md
              has a RULE PRECEDENCE section. Building them per call also fixes guided mode freezing
              base_context at /guided/start — feedback on chunk 2 never reached chunks 3..N, so the
              model repeated, in the same run, the mistake it had just been corrected on.
              4. VERIFY — nothing ever checked compliance. The judge now receives the rules and puts
              each violation in blocking_issues, which fails the gate -> forces a revision round ->
              and re-learns the rule, raising its hit count. Rules raised more than once are marked
              '[RAISED N× — you keep getting this wrong]' in the prompt.
              Also: trimming at the 40-rule cap drops the LEAST-REINFORCED rule, not the oldest;
              `python3 -m src.learning` re-distils an existing store in place (13 raw rules -> 7
              general ones here, .bak kept); and single rules can be deleted (DELETE
              /api/learned-rules/{index} + ✕ in the UI) since they now outrank the style guide."
    - "1.24 — SIX REVIEWER RULES ON OUTPUT QUALITY, encoded as DETERMINISTIC GATES rather than
              prompt text (each one was already implied by the prompt and still came back wrong,
              which is the whole lesson of 1.23: a rule only in the prompt is one the model can
              talk itself out of). New constraints.{content,speaker_notes,analogy,voice,coverage}
              + agenda/recap blocks, all enforced in guardrails.check and scored by the rubric:
              (1) COVERAGE — a syllabus line names a topic, not its scope. The prompt now requires
              enumerating each takeaway's exam-testable sub-concepts and giving each a slide, with a
              closing self-check pass; a silently missing sub-concept caps the coverage dimension at
              2, while a deferral NAMED in the text does not.
              (2) CONTENT — a `content` text block is <=35 words / <=2 sentences: one framing
              sentence, detail in bullets/tables. Bullets may not restate their lead-in, and may not
              restate a table on the same slide.
              (3) VOICE — no second person anywhere (slide-visible text AND speaker notes; this
              REVERSES the old style guide, which required 'you'), no filler ('and all'), and no
              navigational phrases in slide-visible text ('last session', 'as we saw earlier', 'in
              the next slide', …) so every slide stands alone. Recap/Agenda/Upcoming/closing are the
              only places a cross-reference is allowed; notes may keep a lighter continuity voice.
              (4) ANALOGY — must CORRELATE, not just illustrate: an explicit tie-back naming the
              concept ('… — just as <how the concept works>'), matched against a tight list of
              mapping connectives (bare 'like' does not count), plus a structural-match requirement.
              (5) SPEAKER NOTES — 2 sentences, hard cap: one teaching cue + one exam/interview hook.
              Uses an abbreviation-aware sentence splitter so 'i.e.' / 'G.114' / 'TCP.' cannot cause
              a false failure that the revision loop could never satisfy.
              (6) FORMATTING — agenda numbered 1..N and each item BYTE-IDENTICAL to the curriculum's
              key-takeaway line (and to key_takeaways[i]); recap carries ALL of the previous
              session's agenda items in 'topic: subtopics' form. Agenda/recap/takeaway lines are
              explicitly EXEMPT from every word cap, since otherwise the verbatim rule and the
              12-word bullet cap contradict each other — the exact conflict that made the model
              paraphrase the agenda for three sessions running. Session now carries
              prev_key_takeaways so graders can check recap completeness.
              DEPTH MODE was reconciled, not left contradicting: it used to demand 3-6 sentence
              prose blocks and 4-7 sentence notes. Depth now means BREADTH — more slides covering
              more sub-concepts, fuller bullets/tables — while the content, notes, voice, analogy
              and agenda rules hold unchanged. Measured against the existing outputs, the new gates
              fire 64x on missing analogy tie-backs, 41x on over-long notes, 32x on prose content
              blocks and 15x on agenda/recap formatting.
              Two things surfaced while wiring this up: (a) the offline eval loaded whatever course
              was SYNCED, so after the switch from Computer Networks to Operating Systems the golden
              was graded against a different Session 15's takeaways (and CI, with no cache, used the
              xlsx and disagreed) — eval_set.yaml now PINS the golden's course_file; (b) the golden
              itself predates these rules. Its 25 mechanical violations are fixed in place (analogy
              tie-backs, 2-sentence notes, second person, prose blocks split into bullets with no
              content lost); the remaining 11 need it RE-AUTHORED from 4 grouped sections into 7
              verbatim ones, which is an authoring decision, so it is exempted from those two gates
              only, by explicit substring, printed as GRANDFATHERED on every run.
              UI: the sheet templates moved from an inline collapsible (which pushed the whole form
              down the page) to a docked left-gutter side panel mirroring the cost panel."
    - "1.25 — SELF-EVOLUTION NOW SURVIVES ON THE PUBLISHED APP (the 1.23 loop was correct but its
              memory was not durable in deployment, so on the hosted link it silently reset).
              learned_rules.json and regen_events.json are written by the app WHILE IT IS USED, but
              they live on the instance disk and the only DB backup ran at the end of a sync
              (kb_backup, called just from sync.sync). On Render free the disk is wiped whenever the
              instance spins down or redeploys, so a rule learned from a reviewer's regeneration
              survived ONLY if a Connect & Sync happened to run before the instance died —
              otherwise kb_restore brought back the older snapshot and the next TR doc was generated
              with no memory of the feedback. New db.kb_put(name) persists ONE allow-listed KB file
              immediately; learning._save() and regen_log.record() call it on every write
              (best-effort, never breaks a generation). No-op on a persistent disk, where the file
              already survives. Verified against a simulated ephemeral host: feedback -> disk wiped
              -> restart -> kb_restore -> the rule is back in the injected prompt block; with
              kb_put disabled the same scenario loses it, which is what was happening in production."
    - "1.26 — LEARNED RULES ARE NOW TWO-TIER, not one global pile and not purely per-course.
              The store was global while its docstring claimed per-course, so after the switch from
              Computer Networks to Operating Systems a rule like 'Expand Rollback and Starvation
              content' was being injected into Computer Networks documents. But scoping EVERYTHING
              per course is the wrong fix: of the 7 rules learned so far, 6 are house style (copy the
              agenda verbatim, tie analogies back to the concept, no analogy on an example slide),
              so per-course scoping would make every new course start from zero on style and force
              the reviewer to re-give the same feedback — the exact repetition problem this system
              exists to prevent. So each rule now carries scope=global|course plus the course it was
              learned on: global (house style) is injected for every course, course (subject matter
              naming a specific topic/algorithm/protocol) only for its own. The distil call now
              returns the classification as a second line (SCOPE: global|course) at no extra cost;
              learning.applicable_rules(course) does the filtering and learned_rules_block() uses it;
              dedup only collapses against rules that CO-APPLY, so two courses may hold similar
              subject-matter rules. New self_evolution.scope_rules toggle reverts to the old
              inject-everything behaviour. learning.classify_scope/scope_existing migrate a store
              written before scoping (`python3 -m src.learning` now re-distils AND scopes); on the
              real store it classified 6 house + 1 course, correctly binding the Rollback rule to
              Operating Systems. GET /api/learned-rules returns the full store with an `applies`
              flag + the active course, and the UI shows a house/course tag and greys out rules
              learned on another course, so nothing is hidden — only not applied."
    - "1.27 — RULE-STORE MIGRATION IS REACHABLE ON THE DEPLOYED APP. learned_rules.json is runtime
              data and gitignored, so a deploy does NOT carry the locally-migrated store: the
              instance restores the older snapshot from kb_files, whose rules are the raw reviewer
              notes with no `scope`. Under 1.23-1.26 those are treated as house style AND injected at
              SYSTEM level with precedence over the style guide — so a deploy would have made raw,
              typo-laden, slide-specific notes ('yo missed to add sytem model also zny…') carry MORE
              weight than before, on every course. There is no shell on the host to run
              `python3 -m src.learning`, so: new admin-only POST /api/learned-rules/migrate runs
              distil_existing + scope_existing in place, and the UI surfaces a warning + a one-click
              'Distil & scope them' button whenever any stored rule still lacks `scope`. Idempotent
              (rules with `raw` are not re-distilled, rules with `scope` are not re-classified);
              verified twice-in-a-row gives classified:0, and verified on a simulated pre-upgrade
              store that the three raw notes become standalone rules with the original wording kept
              in `raw` and the Rollback one correctly scoped to its course."
    - "1.28 — A DEPLOY COULD LOOK LIKE IT 'DID NOT REFLECT' WHILE THE SERVER WAS ALREADY CORRECT.
              Reported as the sheet-template side panel not appearing on the published link. It was
              not a deploy problem: the live bundle was verified BYTE-IDENTICAL to the local build
              (same md5) with the fixed CSS, yet the browser still rendered the previous UI.
              Starlette's StaticFiles sends only etag/last-modified and NO Cache-Control, so browsers
              apply heuristic caching and can reuse index.html without revalidating — and index.html
              is what names the content-hashed bundle, so a stale copy keeps requesting the OLD
              JS/CSS indefinitely. New server._SpaStatic sets the policy a hashed-asset SPA needs:
              index.html (and the SPA fallback) 'no-cache' so it always revalidates (cheap — the ETag
              makes it a 304), and /assets/<name>-<hash>.<ext> 'public, max-age=31536000, immutable'
              since those filenames change whenever their content does. Verified: no-cache on
              index.html, immutable on the asset, If-None-Match still 304.
              Also fixed in the same pass: .tmplside was positioned as right: calc(50% + 490px) with
              a fixed 262px width but docked from 1420px, where the gutter beside the 940px centred
              column is only 240px — so between 1420 and 1520px its left edge landed at -42px and it
              rendered OFF-SCREEN (invisible, not merely misplaced). It is now anchored to the
              viewport (left: 16px) and sized to the gutter, width: min(300px, calc(50vw - 506px)),
              which keeps a 20px gap at every width and can never clip. Below 1420px it still falls
              back to an in-flow card by design — there is no room for a side panel there."
    - "1.29 — LENGTH DISCIPLINE + ANALOGY/EXAMPLE ECONOMY + SURGICAL REGENERATION. Seven
              reviewer findings, all of which come down to the same thing: the doc was spending
              its budget on RITUAL (an analogy on every slide, a worked example for every topic,
              prose where a bullet would do) instead of on COVERAGE, and it was too long to
              record. Encoded as deterministic gates, per 1.24's lesson.
              (a) PAGE CEILING. There was no length gate at all except recording time, and
              recording time is a poor proxy for page count (a comparison table costs pages but
              almost no narration). New graders/page_grader.py estimates the rendered .docx page
              count from the actual layout model of the template docx_writer uses (6.0in x 9.0in
              text area, 11pt body at 1.15 line spacing + 10pt space-after, heading sizes, bullet
              indent, table row heights) — every constant lives in constraints.pages.layout, so
              it is tunable without touching code. constraints.pages.max = 16 (target 14) is a
              HARD gate in guardrails, is handed to the judge as ground truth, is checked by the
              new document_length_pages eval set, and is shown in the app. Measured on the
              existing outputs, the depth-mode S18 doc lands ~21 pages — the reported defect.
              (b) ANALOGY ONLY AT FIRST INTRODUCTION. An analogy was REQUIRED on every slide
              (1.7), so the model dutifully produced one for advantages/disadvantages slides,
              reasoning slides, comparison tables and worked examples, where it adds length and
              no understanding. Every slide now declares a `role` (concept_intro | mechanism |
              working_example | comparison | advantages_limitations | reasoning | application |
              summary) and the analogy rule is an exact BICONDITIONAL: an analogy is required iff
              role == concept_intro, and is a FAILURE on every other role. Since 'label
              everything concept_intro' would defeat it, concept_intro slides are capped at
              constraints.slide_roles.max_concept_intro_share of the deck.
              (c) WORKED EXAMPLES ARE NOW CONDITIONAL. depth_mode.md made a worked example
              MANDATORY on every doc, which produced example slides for definitional topics
              ('What is a file' does not need one). constraints.worked_example now states when
              an example EARNS its slide (a procedure, algorithm, computation, address
              translation, state trace, or numeric trade-off) and when it must be omitted
              (definition / classification / terminology), with a share cap.
              (d) REALISTIC FIGURES. An example must use figures a practitioner would recognise
              — 0x00400000-style base addresses, 4 KB pages, PID 4312, a 1500-byte MTU — never
              toy or placeholder values. Deterministic gate: a working_example slide must carry
              at least min_numeric_literals concrete values and none of banned_placeholders.
              (e) MISSING SUB-CONCEPTS. 1.24 asked the model to enumerate each takeaway's
              exam-testable sub-concepts in its head; nothing ever verified that it had. The doc
              now emits a `coverage_map` — per takeaway, each sub-concept mapped to the slide `n`
              that teaches it or to a NAMED deferral — which guardrails validate (one entry per
              takeaway, verbatim text, >= min_sub_concepts_per_takeaway each, every slide
              reference resolvable, no unmapped sub-concept). It is a planning artifact: it is
              NOT rendered into the .docx, so it costs no pages.
              (f) REGENERATION IS SURGICAL. Regenerating one guided section re-drafted the WHOLE
              section from scratch, so a note about one slide threw away the slides the reviewer
              was happy with. The model is now asked for a JSON PATCH (edit_slides / add_slides /
              remove_slides / section_name) which src/patcher.py applies to the previous fragment
              in code — so anything the patch does not name stays BYTE-IDENTICAL, a guarantee no
              prompt can give. It falls back to a full regeneration (logged) if the patch is
              unusable, and the applied patch's scope (changed vs untouched slides) is logged and
              scored by the new regeneration_scope_discipline eval set.
              (g) THE LLM QUALITY CHECK AND THE 40-MINUTE BUDGET NOW ALWAYS RUN. Both were
              user-toggleable, so a doc could be produced ungraded and unbounded, and 'the session
              is 40 minutes' was optional. gates.always_run_llm_judge and
              constraints.recording.always_enforced (both true) force them on in one-shot and
              guided mode alike; the checkboxes are gone from the app. DEPTH MODE is therefore
              dormant by default — and it no longer means 'unlimited': the page ceiling applies in
              every mode. Set either flag false to restore the toggles.
              Rubric reweighted to 13 dimensions (adds length_discipline, analogy_discipline,
              example_quality; coverage raised to 15); 5 new eval sets (20-24) and 3 updated
              (03/13/14); guidelines 22-25 added. The golden was re-authored for (b) and (e):
              roles assigned, 4 ritual analogies dropped, a real coverage_map added."
    - "1.30 — OUTPUT DELIVERY, THE FEEDBACK PATH, AND PAGE COUNT IN THE DASHBOARD.
              (a) A REVIEWER LOST AN HOUR OF WORK. She generated and reviewed a full TR
              doc, then found that BOTH 'Download Word' and 'Create Google Doc' failed, and
              copied the whole document out of the preview pane by hand. The file was fine.
              Both endpoints REBUILT the filename from the CURRENTLY-synced curriculum on
              every request — `get_session(n)` then `Session {n} _ {name}.docx` — which is
              only correct while the sheet still says what it said at generation time. This
              is ONE shared instance with ONE active course, so another user pressing
              Connect & Sync renames every session under everyone else's feet; measured
              against the existing outputs directory, 5 of 9 generated documents were
              already unreachable, returning 404 'Generate the doc first' about documents
              plainly on disk. Worse, a session number missing from the newly-synced course
              made get_session raise KeyError — a bare HTTP 500. New src/outputs.py never
              re-derives: it resolves through the run's recorded filename, then the caller's
              explicit filename, then the newest `Session {n} _ *.docx` on disk, and only
              then the derived name — so the one guess that can be wrong runs last. Run rows
              now store docx_name beside docx_path (the path is only valid on the instance
              that wrote it), and the UIs pass run_id + filename. A 404 now lists what was
              searched instead of blaming the user.
              (b) AND THE DISK CAN LOSE THE FILE ANYWAY. Outputs lived only on the instance
              disk, which an ephemeral host wipes on spin-down — and a guided run spans a
              long human review, exactly that window. New run_files table + db.run_file_put/
              get/find: the rendered .docx and .md (~40 KB) are stored against the run at
              render time and served from there when the disk no longer has them, on every
              backend rather than only Turso. gdrive.upload_as_gdoc_bytes lets a recovered
              document still become a Google Doc. New GET /api/preview/{n} returns the
              markdown, and the result card gained a 'Copy full text' button — so no one is
              ever one broken button away from losing a reviewed document again.
              (c) ONE-SHOT MODE HAD NO FEEDBACK PATH AT ALL. Asked whether reviewer feedback
              is really learned, the answer was yes — but only in Guided mode.
              learning.record_feedback was reachable ONLY from a guided regeneration, so a
              reviewer working one-shot had nowhere to give a correction; the UI even had a
              `feedback` source label nothing could produce. New POST /api/feedback +
              a 'Teach the agent' panel on the result card, which SHOWS the distilled rule
              back so a bad distillation can be spotted and deleted instead of being applied
              silently to every future doc. Verified live: the loop itself was healthy —
              7 stored rules, all distilled, scoped and hit-counted (a hurried
              'Since this is an example remove analogy from this' had become 'Remove
              analogies from example sections'). Their hit counts are the real finding:
              raised 4x, 3x and 2x means the SAME correction was re-learned that many times,
              which is precisely why 1.29 converted those three into deterministic gates —
              a rule that lives only in a prompt is one the model talks itself out of.
              (d) PAGE COUNT IN THE DASHBOARDS. runs.est_pages is persisted (via a new
              additive ALTER TABLE migration — CREATE TABLE IF NOT EXISTS is a no-op on an
              existing DB, so a column added to _SCHEMA alone would only ever appear on a
              fresh install). db.summary reports avg_pages / max_pages_seen / page_limit /
              over_page_limit, computed only over runs that HAVE a page count so pre-1.29
              runs do not drag the average down. The admin app gained a Pages column that
              chips red over the ceiling, four length metrics on Overview, and the same
              download fix.
              Three new offline regressions in CI: evals/test_outputs.py (boots the API and
              exercises download / preview / traversal safety / disk-loss recovery, 15
              checks) joins test_gates.py; evals/test_learning_loop.py runs in the manual
              live job (14 checks over distil / inject / dedupe / verify)."
    - "1.31 — WHAT THE FIRST LIVE RUN OF 1.29/1.30 ACTUALLY FOUND. The offline suites all
              passed, so this was only discoverable by generating a real document — worth
              recording as the lesson: deterministic gates can be green while the run still
              fails end to end.
              (a) EVERY GENERATION TRUNCATED. `model.max_tokens` was 32000, sized when a doc
              used ~14.5k output tokens. But max_tokens caps THINKING PLUS TEXT, and Claude
              Sonnet 5 thinks by default — adaptive thinking is on whenever the request omits
              the `thinking` field, where the same request on Sonnet 4.6 did no thinking at
              all. A real S13 run spent 6,863 reasoning tokens before writing any JSON and
              hit the ceiling with the last of five sections unwritten; a truncated response
              cannot be parsed, so the whole paid generation was lost. Raised to 64000
              (Sonnet 5's ceiling is 128k). The same arithmetic caught judge_max_tokens:
              1.29 took the rubric from 8 dimensions to 13, leaving ~1.5x margin on 8k — now
              16000. And src/llm.py's 180s HTTP timeout was tuned for ~90s generations while
              a real one now takes ~330s: raised to 900s (_REQUEST_TIMEOUT_S), with the note
              that `requests` timeouts are per-read, not wall-clock.
              (b) A HALLUCINATED RULE VIOLATION WAS FAILING COMPLIANT DOCS — AND BEING
              LEARNED. With (a) fixed, S13 came back genuinely good: guardrails passed,
              12/16 pages, 36.6 min, 14 slides, analogies on exactly the 4 concept_intro
              slides (0 placement violations), 4 worked examples each with 16-22 real
              figures, a complete coverage_map, rubric 91.2. It was still rejected — on one
              blocking issue from the judge: 'Slide 2 (role=working_example) contains an
              analogy', about a slide with no `analogy` key at all. The mechanism is the
              problem, not the model: the judge is handed every learned rule and told to put
              violations in blocking_issues, which is a hard gate — so it was re-adjudicating
              from prose a rule that 1.29 had already made an exact guardrail, and inventing
              a violation. Then self-evolution distilled that phantom defect into 2 NEW
              durable rules: a hallucination promoted to permanent policy, injected into
              every future generation. New self_evolution.gated_rules declares which learned
              rules a deterministic gate now covers; learning.gate_for/retire_gated stamp
              them (idempotent, run at server startup since the store is DB-restored runtime
              data), applicable_rules drops them from injection AND from judge verification,
              and the app shows them as 'auto-enforced' rather than hiding them — the
              correction is still in force, just checked exactly. On the real store this
              retired 3 of 7 rules (agenda-verbatim, analogy-on-examples, analogy-tie-back).
              The judge also now requires QUOTED evidence — the offending text, slide number
              and JSON field — for any rule violation, and is told that an absent field means
              the rule was followed."
    - "1.32 — THE THIRD GRADER DEFECT, AND TWO PIECES OF HYGIENE. With 1.31 in place the
              S13 doc came back with guardrails passed, 12/16 pages, 34.7 min and 5/5 on
              eleven of thirteen dimensions — and was still rejected.
              (a) THE JUDGE OMITTED A SCORE AND THAT READ AS ZERO. `pedagogy` came back with
              a justification ('Ordering is strong: problem -> idea -> mechanism') and no
              `score` field at all. llm_judge read it through `.get('score', 0)`, so a
              missing value became 0/5: it cost 8 weighted points (90.4 instead of ~97) AND
              tripped gates.rubric_min_per_dimension, and the resulting 'Dimension
              pedagogy scored None < 4' was then distilled into a durable rule. Three
              failures from one malformed field. A missing score is a GRADER malfunction, not
              a verdict of zero: llm_judge now detects unscored active dimensions
              (_unscored/_score_of), retries the judge once, renormalises the weighted total
              over the dimensions actually scored, reports the rest in
              `unscored_dimensions` + a suggested fix, and passes_gates skips them. A
              genuine low score still fails — verified both ways.
              (b) SELF-EVOLUTION WAS LEARNING FROM GRADER NOISE. Both this and the 1.31
              hallucination reached the rule store because learn_from_issues distils
              whatever survives the loop. New learning._GRADER_NOISE filter drops issues
              that describe the grader misbehaving ('scored none', 'no score', 'llm
              error', 'unparseable', 'truncated', 'grader note:') at the entrance,
              while real defects still learn normally.
              Result: S13 ACCEPTED — rubric 95.4, 12/16 pages, 34.7 min, 14 slides,
              guardrails passed, analogies on exactly the 4 concept_intro slides (0
              placement violations), 4 worked examples with 22-24 real figures each, a
              complete 5/5 coverage map, 2 rounds, $0.53.
              (c) evals/test_outputs.py was passing while testing NOTHING on CI: it needs a
              rendered doc and `outputs/` is gitignored, so on a fresh clone it hit the
              'no generated .docx' branch and skipped — green, and worthless. It now
              renders the golden into a throwaway fixture (session 9101, deleted after) when
              no real output exists, so both paths genuinely run.
              (d) knowledge_base/tr_app.db was tracked in git — real users, runs, teams and
              per-run cost committed as source, and every generation dirtying the working
              tree. Untracked and gitignored (with -wal/-shm); db.init() rebuilds the schema
              on a fresh instance and TURSO_* owns the data in production."
    - "1.33 — THE SLIDE CEILING WAS ENFORCED AND NEVER STATED. A guided run of Session 30
              (I/O Systems, 5 takeaways) came back at 23 slides / 57.6 min / ~17 pages /
              rubric 62, failing every length gate at once for $2.06 across 13 calls.
              One root cause with three multipliers.
              (a) NO PROMPT FILE MENTIONED A SLIDE COUNT. constraints.slides.max = 14 is a
              hard guardrail, but system_prompt.md, format_spec.md and context_builder
              never named it — while HARD RULE 1 said 'use MORE slides rather than denser
              slides'. So the ONLY slide-count instruction the model ever received pushed
              the count UP, against a gate that caps it: exactly the prompt-says-X /
              gate-says-not-X trap 1.24 was written about. One-shot drafts landed at 14 by
              luck, bounded indirectly by the time and page budgets.
              (b) GUIDED MODE HAD NOTHING HOLDING IT AT ALL. Each section is one LLM call,
              so no call can see the document-wide budget being spent, and the instruction
              was open-ended ('list the sub-concepts an exam would test, give EACH one a
              slide'). Five takeaways answered that with 23 slides. The ceiling is now
              DIVIDED per chunk (context_builder.chunk_slide_allowance, wired through
              server._slide_budget_state) from the slides the other sections ACTUALLY
              used, not a fixed quota — so a section that ran long squeezes the ones after
              it instead of silently pushing the total over, and the allowances sum to the
              ceiling for every takeaway count (5 -> 3,3,3,3,2; 8 -> 2,2,2,2,2,2,1,1).
              Over the budget the model is told to GROUP related sub-concepts onto one
              slide — never to drop one, never to add a slide. A chunk that overspends is
              now flagged IN THE GUIDED LOG while the run is still open, so the reviewer
              can regenerate that one chunk surgically; discovering it at finalize is
              discovering it too late, because the review panel is gone by then.
              (c) finalize() HAD NO REPAIR PASS. One-shot gets up to 3 revision rounds;
              guided graded once and stopped, so an over-long assembled doc was a dead end
              — the only way forward was to pay for a whole new guided run. New
              gates.guided_length_repair_rounds (1) bounds a trim pass, fired ONLY by the
              three ceilings a chunk review cannot see (pipeline._too_long: slide count,
              recording time, pages — read from the graders' structured output, never by
              matching issue text). Quality defects are still not auto-revised; the
              reviewer gated each chunk. The best-scoring draft is kept, so a trim that
              makes things worse can never ship.
              Also fixed in the same pass: (d) the over-max slide failure read '23 slides
              (max 14) — split content, don't cram', the advice for being UNDER the
              minimum. That string is what the revision pass is TOLD TO FIX, so a doc with
              too many slides was being asked to produce more of them; it now says MERGE,
              names the longest sections, and the under-minimum message keeps the split
              wording. (e) generator._SHRINK_NUDGE told a truncated chunk '3-4 slides is
              fine for one key takeaway' — 5 takeaways x 4 = 20, over the ceiling it was
              nudging toward. (f) run() and finalize() keep the BEST draft, but every
              consumer read result['history'][-1] — the last draft GRADED, which the
              best-draft rule may have discarded. Both now return `final` (the report for
              the doc actually RENDERED) and server/app/run_eval read it, so the metrics
              on the result card cannot describe a draft that was thrown away.
              21 new offline checks in evals/test_gates.py (78 total): the ceiling appears
              in all three prompt modes, allowances sum to it, an overspent budget squeezes
              to the floor, the merge/split messages are the right way round, and
              _too_long fires on exactly the three length gates."
    - "1.34 — WHY A TR DOC SUDDENLY COST $2, AND A COVERAGE FAILURE THE GATE COULD NOT SEE.
              Reported as 'cost jumped by a dollar' plus coverage 2/5 and format_compliance
              2/5 on the same S30 guided run.
              (a) THE PER-DOC COST FIGURE WAS NOT THAT DOC'S COST. src/llm.py kept usage in
              ONE process-wide list, documented as 'fine for this app (one generation at a
              time)'. That assumption died at 1.19, when this became one shared instance
              with a worker thread per job: reset_usage() cleared the single list, so a run
              that finished reported everything spent since the most recent START ANYWHERE
              in the process — another user's generation, or a guided run abandoned ten
              minutes earlier — while the run whose records were wiped reported a fraction
              of its own. The dashboard shows five S30 rows: $2.0621, $2.8462 and three at
              $0.0000. Measured from the real prompt sizes, ONE guided S30 run is ~149k
              tokens / ~$0.57 — and 752,878 / 149,107 is 5.05, the number of S30 runs on
              screen. Usage is now keyed by RUN (llm.use_meter/reset_usage/close_usage/
              usage_totals(run_id)), not by process and not by thread: a guided run spans
              several threads (generate-all, each regenerate, finalize) and each declares
              which run it is spending for. pipeline.run/finalize take run_id; server
              passes the job id / guided id.
              (b) AN ABANDONED GUIDED RUN LOOKED FREE. Cost reached the DB only via
              finish_run, so the three S30 rows still at 'All chunks generated' showed
              $0.0000 having paid for six chunk calls each — org-wide spend understated by
              exactly the runs a reviewer walks away from, which is the common case. New
              db.update_cost writes cost WITHOUT finishing a run; guided mode calls it
              after every chunk and every regeneration (the checkpoint granularity), and a
              crashed one-shot run now records what it spent instead of reporting nothing.
              (c) AND GUIDED MODE REALLY IS DEARER — for a fixable reason. base_context
              (course + target + the summary of every prior deck) is 10,430 tokens for S30,
              IDENTICAL on every chunk call, and it sat in the USER message, so it was
              re-billed in full on all six chunks and on every regeneration. Only the 9k
              system prompt was cached. llm._system_blocks now takes a third
              `cached_context` block — cached, placed after the static system prompt and
              BEFORE the learned rules (which stay uncached, since feedback changes them) —
              and generate_chunk/generate_patch pass base_context through it. Modelled on
              the real sizes: ~$0.57 -> ~$0.32 per guided run, 139k -> 57k input tokens.
              Per-call records now also carry cached_prompt_tokens where the provider
              reports it, so cache hits are visible rather than inferred.
              (d) THE COVERAGE GATE ONLY CHECKED THAT A SLIDE EXISTED. Every complaint
              behind the 2/5 had the same shape — 'sub-concept mapped to Slide 2, but Slide
              2 does not teach it; it is on Slide 5' — and the guardrail could not see it:
              it verified the reference RESOLVED somewhere in the document, so takeaway 3
              pointing at section 1's slide passed silently. In guided mode that is also
              what a slide number left stale by a chunk regenerated at a different length
              looks like. A sub-concept of takeaway i must now map into the section whose
              name IS takeaway i; where no section can be matched by name the check SKIPS,
              because scoping to a guessed section would false-fail the golden, whose four
              grouped sections predate the verbatim-name rule.
              (e) ASSEMBLY LEFT SUCH A REFERENCE STALE. pipeline.assemble_doc renumbered
              slides 1..N and remapped coverage by (section, old n), so a reference to
              ANOTHER section's slide was the one thing left unchanged while every real
              slide moved around it — the map then pointed at whatever slide landed on that
              number. Added a document-wide fallback, used only where the old number is
              unambiguous; a genuinely unresolvable reference is left for the gate to
              report rather than silently rewritten.
              (f) THE JUDGE WAS PENALISING THE SPEC. Part of that 2/5 was 'Buffering &
              spooling is deferred to Session 31 ... this creates false impression of
              coverage' — but a named deferral is exactly what constraints.coverage
              REQUIRES, and the rubric already said a named deferral does not cap the
              score. The coverage dimension now states that a `deferred_to` entry is the
              required form, must not be read as a defect, and that an out-of-section slide
              reference is a deterministic guardrail failure the judge should not
              re-adjudicate — the 1.31 lesson, which is that a judge re-deciding from prose
              what a gate already decides exactly will invent violations, and 1.32's, that
              those get distilled into durable rules.
              19 new offline checks (97 total in evals/test_gates.py): per-run metering
              under interleaved runs and across threads, the cached-block layout, the
              cross-section coverage gate firing and correctly skipping, and the assembly
              remap. NOT explained: format_compliance 2/5 — its justification was not
              captured, and no structural difference between a guided-assembled and a
              one-shot doc accounts for it (session_title, section naming, key order and
              coverage_map shape all match). Expand that run's row for the per-call
              breakdown to confirm (a) directly: more than ~7-9 calls, or repeated
              generate_chunk labels, is contamination from the abandoned runs."
    - "1.35 — SLIDE CEILING 14 -> 18, WITH THE CONTENT BUDGET THAT MAKES IT POSSIBLE.
              Reviewer's call: 14 slides reads as too few. Raising the number alone would
              have reproduced the defect 1.33 fixed, because the live verification run of
              1.33/1.34 landed at 39.8 of its 40 minutes with 14 slides — there was no
              spare recording time to spend. Measured across every generated doc, they
              carry 100-116 skeleton words per slide; at that depth 18 slides is ~46
              minutes and 25 slides is ~60, so the slide count was never the binding
              constraint. The 40-minute budget is.
              So the slide count and the text per slide are now stated as ONE budget seen
              two ways. New context_builder.content_budget() INVERTS time_grader: given the
              ceiling it returns the spoken-word budget the 40 minutes allows (~1262 words
              at the 36-minute target, ~1441 hard, ~70/slide at 18 slides), shrinking as
              the count grows because each slide also costs 15s of transition. Stated in
              the one-shot and guided prompt tails and in every guided chunk instruction
              (a per-section word allowance beside its slide allowance) — because a slide
              allowance on its own is only half a budget: a section can obey it and still
              write twice the words, which is how a doc lands inside the slide gate and
              outside the time gate. system_prompt HARD RULE 1 now says the two are one
              budget and that extra slides exist to give a crowded slide room to breathe,
              never to lengthen the document. Depth mode omits the derived word budget
              (no time ceiling applies there). Per-chunk allowances for a 5-takeaway
              session become 4,4,4,3,3 = 18.
              NOT YET VERIFIED LIVE at 18: the model has to write ~30% less per slide than
              it just did at 14, and only a real generation shows whether it does.
              8 further offline checks (105 total): the prompt names the CURRENT ceiling
              rather than a stale number, the derived budget shrinks as slides are added
              and agrees with time_grader's overhead, both prompt modes and the chunk
              instruction carry it, and depth mode does not."
    - "1.36 — THE PACING MODEL WAS WRONG, WHICH IS WHY 14 SLIDES LOOKED LIKE TOO FEW.
              The reviewer records these sessions and calibrated it directly: a slide takes
              about 1.5 minutes to record WHATEVER IS ON IT, so 26 slides is 39 minutes.
              The word-count estimator disagreed by roughly 2x — it read the accepted
              14-slide Session 30 doc as 39.8 of its 40 minutes, this model reads 21 — and
              that phantom ceiling is what had been capping the document at 14 slides and
              ~1600 skeleton words. The person recording is the calibration authority, so
              constraints.recording.pacing='per_slide' + minutes_per_slide=1.5 is now the
              gate. The word-count figure is still COMPUTED and reported as
              `narration_minutes` so the disagreement stays visible rather than being
              silently discarded, and `dense_slides` names any slide whose narration alone
              would run well past its 1.5 minutes — information for the reviewer, not a
              gate. `time_grader.max_slides_in_budget()` derives the slide ceiling from the
              recording budget so the two can never drift apart (an offline check asserts
              they are equal).
              WHAT ELSE HAD TO MOVE, because the ceilings are tied to each other:
              (a) SLIDES 18 -> 26. This is exactly what 40 min / 1.5 min buys.
              (b) PAGES 16 -> 26 (target 23). Under this model recording time limits the
              slide COUNT and says nothing about text, so the PAGE ceiling becomes the only
              content limit — and left at 16 it would have rejected every document the new
              slide ceiling permits. 26 is derived, not chosen: a slide costs 0.887 rendered
              pages (median over every doc generated so far), so 26 slides is ~23 pages.
              (c) THE CONTENT BUDGET IS NOW PAGE-DERIVED, not time-derived.
              context_builder.content_budget() reports bound_by='pages' and computes ~100
              words per slide (ceiling ~114) from the page budget, using new measured
              constants pages.words_per_page=122 and pages.front_back_matter_pages=1.5. That
              is the density these documents ALREADY have, so the extra slides buy genuinely
              more material: ~2623 words over 26 slides against ~1628 over 14, a ~60%
              increase. 1.35's 'more slides means less on each' framing was correct for a
              time-bounded budget and is WRONG here; the prompt now says teach each slide at
              FULL depth to the budget.
              (d) THE PROMPTS SAY HOW THE BUDGET IS SPENT, not just the number. Trimming a
              slide's text buys NO recording time under this model, so 'be concise to fit 40
              minutes' is actively misleading and 'drop a sub-concept to fit the time' is a
              trade that does not exist. system_prompt HARD RULE 1, style_guide (Length +
              Density), format_spec and context_builder.time_mode_block all state the
              per-slide pace and that text is spent against PAGES.
              (e) THE RUBRIC AND EVAL SETS FOLLOW. recording_time now tells the judge the
              estimate is count-based and forbids it recommending shorter text or dropped
              sub-concepts on time grounds; length_discipline reads 26 pages. Eval set 09
              (recording_time_budget) is re-pointed at the pacing model with slide-count
              thresholds and 4 rewritten cases; set 20 (document_length_pages) at 26/23 with
              its cases rescaled; set 14 cites the new ceiling.
              run_sets._chk_recording_time no longer hardcodes 42/40/20 and no longer scores
              'under 20 minutes' as thin — under per-slide pacing that is just a low slide
              count, and whether it means thin coverage is what the coverage and chunk_count
              sets decide; scoring it here punished a short syllabus line twice.
              9 new offline checks (116 total), the ones that matter being: adding text does
              not move the recording estimate while it does move the diagnostic, a dense
              slide is named rather than failed, and the page gate is what a fat document
              actually busts. NOT YET VERIFIED LIVE at 26 slides — the previous ceiling was
              live-verified at 14 (39.8 min under the old model, 21.0 under this one)."
    - "1.37 — TWO PIECES OF 1.18 REMOVED: THE PROVIDER/MODEL CHIPS AND THE REFERENCE DATE.
              (a) The topbar no longer shows provider / model / API-key / version chips.
              Which LLM runs the agent is an internal detail that changes whenever the model
              lineup does, and the user had no decision attached to it. /api/status therefore
              stops reporting provider, model and version; it still reports key_ok, because
              the Generate buttons are gated on it — and that gate is now explained by an
              inline 'generator is not configured' alert in step 2 instead of a red chip in
              the corner, so a disabled button is never silent.
              (b) The 'Reference date (recency baseline)' field is gone: removed from the
              connect step, from /api/sync (SyncBody.reference_date), from
              src/app_settings.py (reference_date()/save(reference_date=)) and from
              knowledge_base/app_settings.json. Reason from the reviewer: 'current as of
              DATE' resolves to 'newest version wins', which holds for a theoretical session
              but is wrong for a coding one, where the version or tool the industry actually
              uses is frequently NOT the latest release. So the date premise was the wrong
              premise, not a wrong date.
              WHAT SURVIVES, deliberately: guideline 20 / eval set 18 content_recency and
              the rubric dimension of the same name stay in force, because they never needed
              a date — they forbid presenting a DEPRECATED thing as current and allow legacy
              material that is labelled as legacy, which is exactly the coding-session case.
              context_builder.recency_and_course_type_block() is renamed course_type_block()
              and its date sentences are replaced by the date-free rule: never pass off
              something deprecated as the state of the art, teach the version the industry
              actually uses, and say which one you are teaching. Supersedes 1.18(a)."
    - "1.38 — ONE SHEET, ONE MODE, AND THE THREE CONTENT COMPLAINTS.
              (a) INPUT IS NOW A SINGLE SHEET. The curriculum sheet carries each session's
              deck link itself, in a 'PPT Links' column on the session's own row; the
              separate 'Session Details' sheet joined on Session Name is gone, along with
              the second link to paste, the second template to keep valid, and the failure
              where renaming a session in one sheet silently detached its deck. A blank
              cell is not an error — it marks a session not yet recorded, which is exactly
              the set of sessions still needing a TR doc. sync.sync() takes one link,
              sync.last_links() becomes last_link(), and the stored details_link is dropped
              on the next sync. Deck state stays keyed by normalised session name, so no
              previously synced instance re-downloads its decks.
              (b) ONE-SHOT GENERATION REMOVED. Every TR doc is written in the GUIDED flow,
              where a human approves each chunk before assembly; the one-shot path produced
              whole documents nobody had read until they were finished. Gone: /api/generate,
              the UI mode selector, run.py --session, and app.py (the Streamlit UI, which
              was one-shot only — streamlit is off the requirements list with it).
              pipeline.run() survives ONLY as the offline eval harness's way to obtain a doc
              to score; no user-facing surface reaches it.
              (c) THE THREE CONTENT COMPLAINTS, each given a rule rather than an adjective:
                · TECHNICAL CORRECTNESS — constraints.technical states the protocol (verify
                  every specific; if unsure, teach the concept WITHOUT the number rather
                  than inventing one; stay consistent with yourself), the judge's web check
                  now verifies specifics FIRST and must name slide + wrong value + correct
                  value in blocking_issues, technical_accuracy is reweighted 17 -> 20, and
                  gates.guided_repair_on.technical_accuracy lets finalize repair a factual
                  error the chunk reviewer could not have fact-checked.
                · NOTHING OFF THE AGENDA — a slide no coverage_map sub-concept points at was
                  a WARNING, and warnings never reach the revision pass, so off-agenda
                  slides shipped. coverage.every_slide_mapped makes it a hard failure, with
                  overview/comparison/summary exempt (they serve several sub-concepts).
                · PROSE/BULLET MIX — the docs were wall-to-wall bullets because every rule
                  pushed that way ('prefer bullets over text'). Text blocks now allow a real
                  paragraph (35 -> 55 words, 2 -> 3 sentences); at least 60% of slides must
                  carry one (content.min_slides_with_text_share), and a bullet list needs 3+
                  items (content.min_bullet_items) since a two-item list is a bulleted
                  sentence. New eval set 25 prose_bullet_mix scores both halves.
              (d) BROAD -> SPECIFIC IS STRUCTURAL NOW. New slide role `overview` (the
              landscape: what this is and which types/parts it has, named together; no
              analogy), and slide_roles.require_broad_to_specific_opener makes the FIRST
              slide of every section an overview or concept_intro. The judge scores whether
              that slide really sets the map (pedagogy 8 -> 9); the gate only checks the
              role, which is the checkable half.
              The golden (Session 15) predates (c) and (d) and is grandfathered in
              evals/eval_set.yaml + evals/test_gates.py, exactly as it is for the agenda
              rules — each new gate has its own positive test instead."
    - "1.39 — THE INGESTED DECKS NOW ACTUALLY DECIDE SOMETHING, AND A TAKEAWAY IS A CONTRACT.
              (a) COURSE MEMORY WAS EXPENSIVE NOISE. Each prior deck's raw `summary` — deck
              title plus EVERY slide title — was pasted into the context: 38,000 characters
              for this course, in which 'Data Representation' appears eight times and
              'Recap'/'Quiz Time!' dozens of times. ~10k tokens a run to say very little.
              pptx_ingest.taught_index()/taught_digest() replace it with each earlier
              session's DISTINCT topics, de-duplicated and stripped of deck furniture: 950
              titled slides collapse to 293 topics and 8,000 characters. Smaller AND it
              finally reads as 'session 12 taught these things'.
              (b) NOTHING EVER CHECKED THE NO-REPEAT RULE — the point of ingesting decks at
              all. It lived in the prompt, and the judge scored the dimension that owns it
              (`coverage`) with no idea what earlier sessions contained. Now the taught
              digest reaches all three places that need it: the WRITER (as a binding
              already-taught inventory), the JUDGE (as grading context, with the asymmetry
              spelled out — going deeper is required, re-running the introduction is not),
              and a GUARDRAIL. The gate is deliberately narrow: only a slide that
              re-introduces (role concept_intro) a concept under a title an earlier deck
              already used fails; anything else that looks like overlap is a warning, because
              the curriculum legitimately revisits topics and the coverage rules REQUIRE it.
              (c) PER-TAKEAWAY RETRIEVAL. The session-level RAG hits are frozen into the
              cached base context, so the chunk writing takeaway 4 saw prior material chosen
              for the session as a whole — while the overlap that matters is always
              topic-specific. Each guided chunk now carries its own retrieval against its own
              takeaway (context.rag_top_k_per_takeaway).
              Observed live on Session 30 takeaway 1 ('I/O Hardware: Ports, buses & device
              controllers', where session 2 had already taught ports): the old prompt wrote
              'What Is An I/O Port' as a first introduction; with the decks fed in, that slide
              is gone and the section runs controller register model → memory-mapped vs
              port-mapped → bus types and arbitration. Same takeaway, started above what the
              learner had already been taught.
              (d) 100% OF EVERY TAKEAWAY. Every coverage gate measured the doc against the
              model's OWN enumeration of sub-concepts, so a promise the CURRICULUM made and
              the model never enumerated was invisible to all of them. The sheet writes a
              takeaway as 'Topic: item; item, item' and each item is owed to the learner:
              coverage.takeaway_subtopics_must_be_taught parses them out and checks the
              section teaches each one. Matching is on distinctive vocabulary with plurals
              normalised, PLUS any acronym the line names is mandatory — measured: stripping
              every mention of DMA from an I/O section still matched two words in three and
              passed until acronyms became compulsory.
              (e) DEFERRAL WAS AN UNBOUNDED RELEASE VALVE. `deferred_to` exists so a
              sub-concept left to a later session is named rather than dropped silently, but
              nothing stopped it being used to make room — a takeaway could have every
              sub-concept 'deferred' with all gates green. Deferring all of them now fails,
              and coverage.max_deferred_share_per_takeaway (0.34) bounds the rest.
              (f) SECTION NAMING WAS AN UNCHECKED ASSUMPTION. 'One section breaker per agenda
              item, same text' was in the layout rules from the start but only the rubric ever
              looked at it — while the coverage machinery scopes sub-concept references to
              'the section whose name IS takeaway i', and so does (d). A section renamed by a
              word quietly detached both. agenda.sections_named_after_takeaways gates it, and
              (d) falls back to a document-wide search rather than skipping when a section
              cannot be matched, so a naming drift can never silently switch the check off.
              Download and Create-Google-Doc were verified end-to-end against a rendered
              document after the one-shot removal (both resolve through src/outputs.py, which
              the guided result payload feeds exactly as the removed path did)."
    - "1.40 — THE PARAGRAPH AND THE BULLETS WERE SAYING THE SAME THING.
              Reported by the reviewer as happening on almost every slide:
                'Interrupt-driven I/O still burdens the CPU with copying each byte; DMA lets
                 a dedicated controller transfer data directly.'
                   · DMA controller moves data memory-to-device directly
                   · Frees CPU from byte-by-byte copying
              Both bullets are the sentence again. constraints.content.no_restating_lead_in
              _bullets only ever matched VERBATIM lines and nothing on a real slide is
              verbatim, so every instance of this passed every gate. Measured across the
              documents generated so far: 11% of ALL bullets were restating their own lead-in.
              This is a COVERAGE defect, not a style one — the reviewer's own framing: 'I
              limited pages to cover more information; if you are repeating content, we will
              cover less information only'. The page ceiling is fixed, so a repeated line is a
              line that cannot teach anything new.
              (a) THE RULE, stated as a division of labour rather than a prohibition: the
              paragraph carries the FRAMING (what this is, why it exists, how it relates to
              what came before) and the bullets carry the SPECIFICS it does not state (steps,
              types, values, conditions, trade-offs, where it is used). With a deletion test
              the model can actually apply — delete the paragraph, what is lost? delete the
              bullets, what is lost? if either answer is 'nothing', rewrite — and a worked
              wrong/right pair using the reviewer's own DMA slide. Repeated in the style
              guide, the format spec and every guided chunk instruction.
              (b) THE GATE: content.no_bullet_echoes_lead_in fails a bullet whose distinctive
              words are >= 50% already present in one clause of the paragraph above it
              (bullet-side ratio: the question is whether THIS bullet adds anything).
              Threshold chosen against the real corpus, not by feel — every flagged case in
              the 0.45-0.60 band was genuine repetition ('Mutual exclusion means each resource
              is either available or held by one process' / 'Mutual exclusion: one holder per
              non-shareable resource'), and 0.5 catches both slides the reviewer quoted while
              leaving the bullets that genuinely add something ('CPU only sets up transfer,
              then continues') untouched. It feeds the finalize repair pass, so a doc that
              trips it is fixed rather than rejected.
              (c) WHAT THE GATE CANNOT SEE is paraphrase that shares no vocabulary
              ('Applications call generic read/write operations' -> 'System calls expose a
              uniform I/O interface'). That half is the judge's: slide_content_style now makes
              redundancy its heaviest criterion, with the deletion test and an explicit
              instruction not to accept a bullet as new merely because the words differ. Eval
              set 25 became a hybrid for the same reason, carrying both reviewer slides as
              bad cases and the rewrite as a good one.
              (d) THE TRAP IS WORST ON concept_intro SLIDES, where the paragraph wants to both
              define the thing and narrate how it works, leaving the bullets nothing to do but
              repeat. Both the system prompt and the chunk instruction now say to keep every
              mechanical detail OUT of the paragraph there.
              Measured live on the same section, regenerated: repeating bullets fell from 5 of
              28 (18%) to 1 of 24 (4%), worst overlap 67% -> 50%. The paragraph on the polling
              slide went from narrating the status-register loop to explaining why polling
              exists and when it still suits, leaving the loop, the busy/ready bits, the cost
              and the real uses to the bullets — five distinct pieces of information on a slide
              that previously carried two.
              (e) …BUT THE PROMPT ALONE IS NOT RELIABLE, and a second live section proved it:
              a freshly generated takeaway-4 section came back at 5 of 22 bullets repeating
              (23%) under the very same rules that produced 4% on takeaway 3. So the fix
              cannot rest on instruction quality. Two additions make the gate the guarantee
              rather than the prompt:
                · REVIEW-TIME SURFACING. Each guided chunk is checked as it is generated
                  (server._chunk_repetition, same measure as the guardrail) and the offending
                  bullets are listed in the live log AND in the review panel, above the
                  Approve button. That is the cheap moment to fix it — regenerating one
                  section costs a fraction of a repair pass over the assembled document, and
                  the reviewer can no longer approve a chunk without seeing the defect.
                · gates.guided_length_repair_rounds 1 -> 2. One round was sized for a single
                  length overshoot; this gate can report five or six bullets at once, and one
                  pass clears some but not all. The second round only runs if the first did
                  not finish, and the best draft still wins."
    - "1.41 — THE JUDGE WAS DEDUCTING POINTS IT COULD NOT JUSTIFY, PLUS FOUR UI FIXES.
              (a) WHY A GOOD DOCUMENT SCORED 86. Investigated from the reviewer's question,
              and it was not the document. Grading a real accepted doc returned 91.6 with ZERO
              blocking issues, having thrown away 8.4 points across four dimensions whose
              justifications named no defect at all: technical_accuracy 4/5 ('Verified
              concrete specifics ... are standard and correct ... accurate ... correctly
              explained'), pedagogy 4/5 ('structure is strong overall'), slide_content_style
              4/5 ('mix is present throughout ... no one- or two-item bullet'), example_quality
              4/5 ('examples are warranted ... realistic'). The judge had checked, found
              nothing wrong, and deducted anyway — and at weight 20 technical_accuracy loses 4
              points for that shrug alone, which is the difference between clearing the
              90 gate and being sent into a repair round the document did not need.
              THE FIX is in the rubric's scale and output contract, not the code: 5 now means
              'no defect found' rather than 'nothing to fix', 4 means 'one specific, nameable
              issue', and any score below 5 must QUOTE the offending slide and text. The caps
              are untouched and still absolute.
              MEASURED, same document and same model: 91.6 -> 100.0, and all four phantom
              deductions became 5s. VERIFIED NOT TO BE BLINDNESS — the same document with
              three defects injected (a false 'RFC 2119 7-bit port space', bullets restating
              their paragraph, a second-person navigational lead-in) scored 68.6, capping
              technical_accuracy and slide_content_style at 2 with quoted blocking issues, and
              additionally caught an internal contradiction that was not deliberately planted
              (the invented 7-bit port space against the real 'ports 0-65535' three slides
              later). A grader that finds nothing on a clean doc and six things on a dirty one
              is calibrated; one that finds four unnameable things on both is not.
              (b) THE POLICY CHIPS ARE GONE from the generate panel ('LLM quality check on
              every generation', '40-minute session', 'Max 26 pages'). They restated three
              constants on every visit with no decision attached to any of them. All three are
              still enforced exactly as before — the budgets appear in the hint under the
              generate button, and the grading bar now appears next to the score where it is
              actually actionable.
              (c) DECK EXTRACTION GAPS moved out of the sync result into their own collapsed
              section. A handful of decks always have an image-only or divider slide with no
              extractable text, so the list appeared in full, in warning orange, on every
              single sync — which is how a real warning stops being read. It is a completeness
              diagnostic, so it now sits behind a neutral 'open only if you want to check what
              the decks did not give us'.
              (d) KEY TAKEAWAYS were rendered as a bulleted list, but the curriculum lines
              already begin '1.', '2.' — so every line was numbered twice, once by the sheet
              and once by the UI. The list markers are gone.
              (e) THE RUBRIC PANEL now explains its own number: dimensions ordered by what
              they COST (weight x shortfall) instead of arbitrary order, each row showing its
              weight and points lost, the acceptance bar stated, and anything under the
              per-dimension minimum called out — since a lone 3 fails a 95-point document.
              llm_judge ships `weights` and `gates` with every result so an old run stays
              readable after the rubric changes."
    - "1.42 — EXTRACTION GAPS TO THE LEFT PANEL, AND RESUME THAT FOLLOWS THE USER.
              (a) The extraction-gap list moved out of the centre column into the LEFT side
              panel, sharing the slot with the sheet templates (one open at a time — stacking
              two fixed panels covers the page on a laptop). Even collapsed, a full-width
              block in the middle of the sync result reads as 'something needs your
              attention' on every sync, and this is reference material, not a verdict.
              (b) RESUMING AN UNFINISHED RUN ONLY WORKED IN THE BROWSER THAT STARTED IT. The
              offer came from localStorage['tr_guided_id'], so signing in from another
              machine, clearing site data or using a private window stranded a run holding
              several already-paid-for chunks — while the server still had its checkpoint and
              would have restored it happily. The checkpoints carry user_email, so the server
              can now answer the question directly: db.unfinished_guided() +
              GET /api/guided/resumable list this USER's unfinished runs, each with its
              session, title, and how many chunks are already generated. The localStorage id
              is kept only as a fallback for a run the server list has not caught up with.
              Finished and errored runs are excluded (they are history, and the runs table
              already holds them), and a checkpoint past the 72h purge window correctly does
              not appear.
              Two things this needed: `session_title` is now persisted with the checkpoint so
              a run can name itself without re-deriving it from a course that may have been
              re-synced since, and /api/guided/{gid} returns `session_no` so resuming can move
              the session selector to the run being restored. That selector move would
              otherwise have triggered the effect that tears down the guided panel when the
              user picks a different session — it is now suppressed for this one programmatic
              change (skipSelResetRef), since resuming must not destroy what it is restoring.
              Discard remains local: deleting the server checkpoint would take away the
              ability to come back to the run from another browser, which is the whole point."
    - "1.43 — THE AGENT OWNS THE CURRICULUM, AND A DECK IS DOWNLOADED ONCE.
              (a) THE COST. Every sync re-downloaded every deck the course has ever had.
              Extraction was cached; the DOWNLOAD was not, because the cache key was a
              content hash and computing it means fetching the file. Google's Slides export
              endpoint offers no ETag, no Last-Modified and sends Cache-Control: no-store —
              measured directly, so there is no cheap remote way to ask 'did this change?'.
              At ~4.7 MB and ~3.4 s per deck, single-threaded, a 30-deck course paid ~102
              seconds of transfer per sync to learn that nothing had changed.
              (b) THE MODEL IS INVERTED. New `curriculum` table = the course, owned by the
              agent. The sheet is an IMPORT FORMAT: bring a course in once (or re-import
              deliberately), then edit it in the app. Each row carries its ppt_link and the
              hash of the deck extracted FROM that link, so ingestion fetches only what is
              new or changed. Editing a takeaway cannot touch a deck (curriculum_upsert
              leaves the link alone unless a link is passed); replacing a link clears that
              one row's hash and marks it pending.
              MEASURED end to end on the real course: first import 30 fetches, every sync
              after that 0 — `python run.py --sync` went from ~102 s to 1.2 s. Editing a
              takeaway: 0 fetches. Adding one session with a link: exactly 1.
              (c) THE UPGRADE COSTS NOTHING. An instance already holding extracted decks
              would have seen an empty table, called all 17 of them new and re-fetched the
              lot — the exact waste being removed. sync.adopt_existing_decks() matches rows
              against the older knowledge_base/sync_state.json record (same link + extracted
              file present) and adopts its hash. Verified: 17 recognised, only the 13
              genuinely missing marked pending.
              (d) THE DASHBOARD. An editable table in the app — add/edit/delete sessions,
              edit key takeaways, attach deck links, save — with each row showing whether
              its deck is extracted, pending or absent. GET/POST /api/curriculum,
              DELETE /api/curriculum/{n}, POST /api/curriculum/ingest {force, sessions}.
              course_loader reads the table FIRST (falling back to the on-disk cache for an
              offline eval process), so an edit is live for the next generation with no sync
              at all; sync.write_course_cache keeps knowledge_base/course_structure.json as
              the table's projection so pptx_ingest, the RAG layer and the eval harness were
              untouched. The generate panel is now gated on the curriculum the agent HOLDS
              rather than on having run a sync in this browser session.
              (e) `force` exists for the one case the cheap path cannot cover: slides edited
              behind a link that did not change. It is a button, not a default, because it
              is the expensive path by definition."
    - "1.44 — THREE DASHBOARD DEFECTS, ONE OF THEM ALARMING AND HARMLESS.
              (a) TYPING INTO THE TAKEAWAYS BOX SHOWED NOTHING. The form rule styled an
              ENUMERATED list of controls — input[type=text], [type=date], input:not([type])
              and `.regen textarea` — so anything outside that list fell through to the
              browser default (white background, black text), while the :focus rule below it
              applies to EVERY textarea and sets a dark background. Result: the new takeaways
              textarea was black-on-white until focused and black-on-black while being typed
              into. The session-number input (type=number) had the same hole. Fixed by
              styling the CLASS of control rather than a list of instances, plus an explicit
              colour in every state, so a new field cannot be born broken.
              (b) 'EVERY SESSION WENT PENDING AFTER A SAVE' — and nothing was re-extracted.
              The `extracted` flag was computed inline in the GET handler only, so the POST
              and DELETE replies returned rows WITHOUT it; the dashboard renders 'pending'
              whenever the flag is falsy, so saving one edit made all 34 sessions look
              pending until the next refresh. That is also why clicking extract appeared to
              'fix' 30 decks ten seconds later: the ingest completes, the page reloads the
              curriculum, and the flag comes back. One shared _curriculum_rows() helper now
              feeds every response, so the shape cannot drift again. Verified: 30/34
              extracted before AND after a save.
              (c) A SESSION LEFT THE GENERATE DROPDOWN once its deck was extracted, which
              looked like a defect and was not: _session_list() excludes sessions that have
              an ingested deck because such a session has already been recorded and is
              course MEMORY, not work to be done. The session in question had a deck
              precisely because one had just been pasted into its row, so the filter was
              doing its job. Briefly changed to list everything with an 'already recorded'
              label; REVERTED at the reviewer's request — the filter is the intended
              behaviour. What remains is a line under the dropdown stating the rule, so the
              same disappearance reads as the rule working rather than as something going
              wrong.
              …and then a REAL defect surfaced behind the same symptom: a session whose row
              said `no deck` was still missing from the list. The exclusion was reading the
              deck FILES ON DISK, not the curriculum, so a deck extracted earlier kept its
              session hidden even after the link had been removed from the row — with no way
              to put it back. Two changes: _session_list() now asks the CURRICULUM which
              sessions have a deck (the disk scan survives only as the fallback for a
              process with no curriculum rows, i.e. offline evals), and
              sync.prune_orphan_decks() deletes the extracted text for any row whose link
              has been cleared, called after every save and delete. The second half matters
              beyond the dropdown: course memory must follow the curriculum, or the writer
              keeps being told a deck was 'already taught' for a session the course says has
              none. Guarded so an empty curriculum prunes nothing — a database that has not
              been restored yet can never wipe the knowledge base."
    - "1.46 — THE CURRICULUM READS LIKE THE SHEET, AND A COURSE BELONGS TO A TEAM.
              (a) THE DASHBOARD IS FLAT AGAIN. Takeaways and the deck link sat behind a
              per-row expander, so reading a course meant opening every session one at a
              time — the opposite of what a spreadsheet is for. Every column is inline now
              (Session · Topic · Session name · Key takeaways · PPT link · Deck), takeaways
              in a real multi-line box, so the whole curriculum reads at a glance in the
              shape it was imported from. Below 1100px the row stacks instead of shrinking
              to nothing; there is still no expander to click.
              (b) A COURSE IS A SHARED, TEAM-OWNED THING. It used to be typed into a text
              box, which made it a private label: two people spelling it differently ended
              up with two separate curricula, and a course one person imported was invisible
              to everyone else. New GET /api/courses + POST /api/courses/select and a course
              picker at the top of the app. Visibility follows the team model that already
              existed: admins see every course; a member of one or more teams sees exactly
              those teams' courses and nothing else; someone on no team yet sees all of them,
              because scoping a new user to nothing would lock them out of an agent they are
              entitled to use. Verified: asha (Networks team) sees only PROBE-CN, meera (DB
              team) only PROBE-DBMS, a teamless user sees both, and both members of a team
              open the identical imported curriculum.
              (c) COURSE IS NOW EXPLICIT ON EVERY CURRICULUM REQUEST (?course=…). It was read
              from app_settings, a single instance-wide setting — so on a shared deployment
              one person switching course silently moved everybody else's. Reading is fully
              per-request now; only STARTING a generation still consults the active course,
              which POST /api/courses/select writes. Two people generating for DIFFERENT
              courses at the same moment would still contend for that one setting: a known
              limit, written down rather than papered over.
              (d) TEAM HISTORY IS SCOPED BY COURSE, NOT BY THE team_id STAMPED ON A RUN. That
              stamp is written at generation time from team_for_user_course(), so it is null
              for a run made before the team existed, before the person joined it, or by
              someone on no team — and every one of those was invisible to the team it
              belonged to. Measured on a probe: by team_id the team saw 1 of its 2 runs; by
              course it sees both, each labelled with who made it. A team with no course set
              keeps the old team_id behaviour rather than showing nothing.
              (e) The admin page's course fields now offer the courses the agent actually
              holds (datalist). A team's course is matched by exact name, so 'Operating
              System' for 'Operating Systems' silently showed its members nothing."
    - "1.47 — CREATE A COURSE, AND DISCARD THAT ACTUALLY DISCARDS.
              (a) DISCARDING AN UNFINISHED RUN DID NOT STICK — the prompt came back on every
              page load, with no way to dismiss it. Self-inflicted in 1.42: Discard was made
              deliberately LOCAL so a run could still be resumed from another browser, which
              got the trade backwards. The multi-browser benefit belongs to RESUMING; a
              discard is a decision about the RUN, so it has to be recorded where the run
              lives — otherwise the very next call to /api/guided/resumable hands the same
              run straight back. db.discard_guided() marks the checkpoint, unfinished_guided()
              skips 'discarded' alongside 'done' and 'error', and POST
              /api/guided/{gid}/discard is what the button calls. The row is MARKED rather
              than deleted, so a mis-click is still recoverable from the database until the
              72h purge. Verified: offered → discarded → not offered, across reloads.
              (b) 'IMPORT ANOTHER COURSE' IS NOW 'CREATE NEW COURSE'. The two jobs that card
              does were conflated, and the difference matters: creating a course that does not
              exist (name editable, becomes a new entry in the picker) versus re-importing the
              sheet into the course already open. With one shared form and a free-text name, a
              re-import could silently fork a second copy of the same course under a slightly
              different name — the exact failure the course picker was introduced to end. The
              name field is now editable only when creating; re-import locks it to the open
              course, and the heading, help text and button all say which of the two is
              happening. On success the picker reloads so a new course is selectable from
              then on.
              The flow is now the one the reviewer described: pick an existing course from
              the dropdown, or create a new one — and only then does anything below it appear."
    - "1.48 — WORKSPACES, AND AN APPLICATION INSTEAD OF A SCROLL.
              (a) THE UI WAS ONE COLUMN OF STACKED CARDS — curriculum, generate, result,
              history, teams, learned rules, all on top of each other, so the page grew
              without end and finding anything meant scrolling past everything else. ('What
              kind of UI is this' was the reviewer's manager, and it was a fair question.)
              Rebuilt as a shell: a fixed left rail answering WHERE you are working (an
              Individual or Team workspace), ON WHAT (the course), and WHICH SECTION you are
              in — Curriculum · Generate · History · Team · Agent rules — beside one focused
              view. The learned-rule list moved out of the result page into its own section:
              it is about the agent across every future doc, not about the doc just made.
              Below 900px the rail becomes a strip above the content so nothing is squeezed
              out of reach.
              (b) A TEAM OWNS COURSES, PLURAL. `teams.course` held exactly one, so a team
              working across two courses needed two teams with the same members and 'pick the
              team, then pick its course' could not be expressed. New team_courses table; the
              old column stays as the primary course, seeded from the first course attached,
              so nothing that reads it had to change.
              (c) EVERY CREATION LANDS UNDER THE WORKSPACE. GuidedStartBody now carries
              team_id + course, validated against real membership server-side (the id comes
              from the client), so a doc built in a team workspace is stamped with that team.
              db.team_runs() gathers a team's work by ITS STAMP or by ANY COURSE IT OWNS,
              which is what makes the history complete: runs made before the team existed,
              before a member joined, or by someone on no team were invisible under the stamp
              alone. Verified — a member added afterwards sees all 3 probe runs and both
              courses, and a colleague added to the OS team opened the 34-row curriculum
              somebody else had imported without importing anything.
              (d) A COURSE CREATED INSIDE A TEAM WORKSPACE JOINS THAT TEAM immediately
              (POST /api/teams/{id}/courses, open to members, not just admins) — otherwise
              its creator would be the only person able to see it, the exact failure the
              shared model exists to end.
              (e) THE NAME-MISMATCH TRAP IS NOW VISIBLE. A team whose course reads 'Operating
              System' against a curriculum called 'Operating Systems' silently showed its
              members an empty workspace — seen in a real screenshot. /api/workspaces reports
              `unknown_courses` and the Team panel says so in plain words, pointing at
              /admin → Teams.
              (f) An already-imported course opens straight into its dashboard — including an
              EMPTY one, so a course created by hand can have its first session added there
              instead of being pushed back into a sheet import. The create/import card is now
              a deliberate act: it appears when asked for, or when the agent holds no course
              at all."
    - "1.49 — THE UI IS NOW TESTED, NOT ASSUMED. `vite build` proves the JSX PARSES and
              nothing more, and 1.48 was a large restructure verified only by that plus
              reading. frontend/test/ui_smoke.mjs mounts the REAL App.jsx in jsdom with the
              API stubbed, then drives it as a person would — switch tabs, switch workspace,
              open the create-course form — and asserts what is on screen. Run it with
              `cd frontend && npm run test:ui`.
              It paid for itself on the first run by catching three defects a green build had
              hidden completely:
                · `teams.find()` on the very first render, where `teams` is null until its
                  fetch lands — this CRASHED THE WHOLE APP to a blank page on load, for
                  everyone, every time;
                · the Agent-rules section was always empty, because the rule list was only
                  ever fetched after a generation finished (fine when it was appended to the
                  result page, wrong now that it is its own section);
                · '＋ Create new course' did nothing when pressed from any tab other than
                  Curriculum, since that is where the form renders.
              33 assertions, no API key needed, ~2 seconds. The tabs, the sheet-shaped
              curriculum columns, the workspace switch narrowing the course list, and a
              colleague's doc appearing in team history are all now regression-checked."
    - "1.50 — ADD A SESSION WHERE YOU ARE, MERGE A COURSE INTO A TEAM, AND STOP WAITING.
              (a) THE APP WAS SLOW because of ROUND-TRIPS, not computation. Measured: 26 DB
              queries for a single page load, each a network hop on the cloud database the
              app actually runs against (locally, on a SQLite file, the same work is 6 ms and
              invisible — which is why it had never shown up). teams() alone was 1 + 2 per
              team, and was being fetched two or three times per request because
              teams_for_user() re-fetched it internally; courses_for_user() then ran a full
              SELECT per course just to count its rows; team_runs() ran one query per course
              plus one for the stamp. Now: teams() is 3 queries whatever the team count,
              teams_for_user() accepts a list the caller already holds,
              curriculum_session_counts() counts every course in one GROUP BY, and
              team_runs() is a single query. 26 -> 14.
              Separately, 'does this session have a deck?' was answered by load_all_decks(),
              which reads and JSON-parses every deck in the course (1.1 MB across 30) and ran
              three times per page load. The filename carries the answer:
              pptx_ingest.deck_session_numbers(), 0.3 ms against 5.8 ms.
              (b) A SESSION CAN BE ADDED WHERE IT BELONGS. The only add button was at the top,
              so adding to a 34-row course meant scrolling back up every time. There is now an
              insert strip between every pair of rows and an add button after the last one.
              The new row takes the next FREE session number rather than pushing the rows
              below it down: a session's extracted deck is stored against its number, so
              renumbering would detach every deck below the insertion point and re-download
              the lot. The number is editable, and two rows claiming the same one are flagged
              with Save blocked — course+session_no is the primary key, so that save would
              have silently overwritten one row with the other.
              (c) CREATE-NEW-COURSE SHOWED THE OLD COURSE'S CURRICULUM underneath the form:
              startNewCourse() cleared the NAME but not the rows, so the new course appeared
              to arrive with 34 sessions already in it. Cancel now restores what was open.
              (d) A SOLO COURSE CAN BE MERGED INTO A TEAM — the case of starting alone and
              being joined later. The dashboard offers 'Share with <team>' for any team that
              does not already own the course, and shows which team owns it once shared.
              Nothing needs migrating: the curriculum and the history are both gathered BY
              COURSE, so the moment the team owns it everyone on it sees the whole thing,
              including everything built before they arrived.
              (e) A context line above each section states where you are — workspace ›
              course, the team's other courses one click away, and how many people it is
              shared with — so 'pick the team, then pick the course' reads as the two steps
              it is.
              UI harness extended to 48 assertions covering all of the above."
    - "1.51 — 'I SELECTED 32 AND GOT A DOC FOR 31'. Investigated end to end and the current
              code does NOT do this: the client posts session_no 32 (checked by intercepting
              the request in the UI harness), neighbours(32) resolves cur=32 / prev=31, and a
              LIVE generation of the opening chunk for 32 returned recap.prev_session_no=31
              with Session 31's five agenda items and session 32's own takeaways as the
              agenda. So nothing was reproduced, and no fix could honestly be claimed.
              What DOES produce exactly that symptom is resuming an abandoned run: a run
              carries its own session, fixed when it started, so resuming one for session 31
              while the picker sits on 32 means every chunk under review is 31's — and the
              reviewer had abandoned runs being offered over and over, because until 1.47
              Discard did not stick. Nothing on screen said which session the open run
              belonged to, so the two could disagree silently.
              The panel now names it — 'Generating Session 31 — Spooling, Buffering & Disk
              Structure' — and says plainly when that differs from the picker, with the
              consequence spelled out ('will produce that document — discard it and start
              again'). The disagreement is visible at the moment it matters instead of being
              discovered in the finished document. Harness at 51 assertions, including a
              resumed run for a session other than the selected one."
    - "1.52 — THE OFF-BY-ONE FOUND, AND FOUR THINGS THE AGENT SHOULD HAVE DONE ITSELF.
              (a) ROOT CAUSE of 'I selected 32 and got 31', from a screenshot showing session
              32 selected while the log generated session 31's takeaways: THE SESSION PICKER
              WAS NEVER LOCKED DURING A RUN. A run's session is fixed the moment it starts,
              so changing the picker mid-flight left the screen saying 32 while every chunk —
              and the finished document — was 31's. Now disabled while a run is active, with
              the run's own session named beside it. (1.51 added the mismatch banner; this is
              the cause it was pointing at.)
              (b) THE COST PANEL SAT ON TOP OF THE TEXT. It was position:fixed at
              `left: calc(50% + 490px)` — an offset computed for the old 940px page, which
              put it in the empty gutter. The shell is 1360px now, so the same offset lands
              inside the content. Any panel positioned by an assumed page width will do this
              again, so it is part of the layout instead. The sheet template and extraction
              gaps moved from the fixed left rail into the content column for the same
              reason, and because that is where they can actually be read.
              (c) PER-COURSE LENGTH BUDGETS, PER-SESSION OVERRIDES. The page and slide
              ceilings were single harness numbers applied to every course — right as a
              default, wrong as a rule, and changing one meant editing a config file for
              everybody. New src/budgets.py resolves session override → course default →
              harness default, and every consumer (prompt, guardrails, page grader, repair
              pass) asks it rather than reading the harness. Sanity-clamped, so a stray 0 or
              5000 in a form field cannot become a ceiling no document can satisfy.
              (d) THE AGENT NOW FIXES WHAT IT DETECTS. It was finding repeated bullets in a
              chunk and then telling the REVIEWER to press Regenerate — the wrong division of
              labour: a defect the machine can quote precisely is one it should repair, and a
              human's attention is worth more than one extra call. A chunk whose bullets
              restate their paragraph is now sent back once, with the offending lines quoted,
              before anyone is asked to look at it. Once, and only if the retry is measurably
              better — a re-roll that trades one defect for another is not worth its cost.
              (e) COST: 25,470 TOKENS PER RUN WERE SPENT RE-SENDING WORK ALREADY DONE. Every
              chunk received the full JSON of every chunk before it, at full price (it changes
              per call, so it can never be cached) and growing with the SQUARE of the takeaway
              count. A chunk needs two things from its predecessors — what is already covered,
              and which slide numbers are taken — not their prose, tables, analogies or
              speaker notes. _approved_digest() sends exactly that: 89% smaller, 25,470 ->
              3,360 tokens per six-chunk run, verified by a live generation that continued
              numbering correctly from slide 14 and covered the right takeaway.
              Also measured and fixed this round: 26 database round-trips per page load down
              to 14 (teams() was 1+2N and fetched three times per request; course counts ran
              a SELECT per course; team history ran one query per course), and the
              'has this session got a deck?' check stopped parsing 1.1 MB of deck JSON three
              times per load in favour of reading the filenames — 5.8 ms to 0.3 ms."
    - "1.53 — WHY THE PUBLISHED LINK KEEPS RETURNING 503.
              Two causes, one of them ours.
              THEIRS (unfixable in code): a FREE web service spins down after ~15 minutes
              without traffic. The next visit wakes it and the platform answers 502/503 for
              the 30-60s the container takes to boot. That is the plan working as sold; the
              only real fixes are a paid instance or living with a slow first visit.
              OURS: the app made that window far longer than it had to be, and could make it
              permanent. Everything ran at IMPORT time, so the process did not bind its port
              until it had finished the schema round-trips, a 1.3 MB knowledge-base restore
              pulled back from the cloud database, a learned-rule sweep and a checkpoint
              purge — every one a network call to a database that may itself be cold. The
              health check had nothing to talk to for all of it. And db.init() was NOT
              wrapped: one hiccup there raised through the import, so the service never
              started at all — a permanent 503 until someone redeployed.
              Now: the schema step is best-effort and never fatal, the other three run on a
              background thread, and a new /api/health touches no database, no disk and no
              auth — because a health check that queries a cold database fails precisely
              when you least want the instance pulled out of service. render.yaml points at
              it. Measured: the port answers 0.52s after launch instead of after all the
              housekeeping, and /api/health reports each step with its timing so the next
              slow boot can be read rather than guessed at."
    - "1.54 — A 500 THAT COULD NOT BE DIAGNOSED, AND A BUDGET BOX IN THE WRONG PLACE.
              (a) THE ERROR MESSAGE NAMED NOTHING. A screenshot reading 'Request failed
              (HTTP 500). Is the backend (server.py) running?' is the second time a failure
              could only be guessed at, because the client named neither the request nor the
              reason and the server logged nothing a user could quote. Reproduction was
              attempted properly first — every read endpoint (workspaces, courses, my/teams,
              my/history, curriculum, course-settings, sessions) and every write (course
              settings across four payload shapes, a curriculum save) returned 200, including
              under the reviewer's own account and their exact team setup — so no fix could
              honestly be claimed for the cause. What CAN be fixed is the blindness: an
              exception handler now prints the traceback server-side (where the platform
              keeps logs) and returns the path and exception type, and the client puts the
              failing path in the message. The next occurrence can be read rather than
              reconstructed from a screenshot.
              (b) THE COURSE BUDGET MOVED OUT OF THE CURRICULUM ACTION BAR. Wedged between
              the action buttons a labelled number box stretched full width and dominated a
              row meant for the things you press every visit — and it is set once per course,
              not touched while editing sessions. It has its own Settings section now,
              alongside course type, showing what is currently applied and which level it
              came from. The per-SESSION override stays in the table, because a value
              belonging to one row belongs on that row.
              (c) ON THE MISSING TEAM: with the reviewer's exact data the rail DOES list
              their team — but its course reads 'Operating System' against a curriculum named
              'Operating Systems', so the workspace opens empty. /api/workspaces reports that
              as unknown_courses and the Team panel says so in words; the fix is one edit in
              /admin -> Teams."
    - "1.55 — THE CURRICULUM TABLE BROKE THE MOMENT IT GREW. Adding Pages and Slides
              columns took each row to NINE cells against a grid still declaring SEVEN, so
              Deck and the remove button wrapped onto a line of their own under every
              session and the sheet stopped reading as a sheet. A CSS grid does not
              complain about this — it silently wraps — which is why it shipped.
              The columns are gone from the table, which is back to seven cells against
              seven columns, and per-session overrides moved into Settings beside the course
              budget: a rare adjustment does not earn permanent width in the view you use
              every visit. The table also scrolls inside itself now rather than pushing the
              page sideways.
              Guarded properly this time: the UI smoke test asserts the header cell count
              AND that a row has exactly as many cells as the header, so the next column
              added either updates the grid or fails the test.
              The override got its own endpoint (POST /api/session-settings) rather than
              riding on the curriculum save — that path upserts the whole row, so a request
              carrying a session number and two numbers would have blanked the session name
              and takeaways. Verified end to end: setting an override leaves the session
              content intact, and clearing it returns to the course default."
    - "1.56 — SIGN-IN DIED WHEN GOOGLE WAS UNREACHABLE, AND ASKED GOOGLE FAR TOO OFTEN.
              The 1.54 error handler paid for itself immediately: instead of another bare
              500 the screen read TransportError on /api/auth/login ... SSLEOFError, which
              names the real problem — the SERVER could not open a TLS connection to
              www.googleapis.com to fetch Google's signing certificates. Typically a proxy
              or firewall between the host and Google.
              Two defects behind it:
              (a) verify_credential() caught only ValueError, so a TransportError escaped as
              an unhandled exception. A network failure was presented as a broken app.
              There is now AuthUnavailable — 'we could not ask' — kept distinct from
              AuthError — 'we asked and the answer was no' — with one retry, because an
              SSLEOFError is usually gone a moment later. It returns 503, NOT 401:
              a 401 makes the client discard the session and bounce to the login screen,
              which is the worst possible response to a passing network blip. It logs the
              user out over someone else's outage and sends them to re-authenticate against
              the very service that is unreachable.
              (b) IT ASKED GOOGLE ON EVERY REQUEST. verify_oauth2_token() fetches Google's
              certificates over the network each call, and current_user() runs on every
              single API request — so a page load spent several round-trips to
              googleapis.com re-verifying a token it had just verified, and one flaky moment
              on that link locked the whole app out. A Google ID token is signed and carries
              its own expiry, so re-asking seconds later learns nothing. Verified tokens are
              now cached for 5 minutes, capped by the token's own exp. Measured: five
              requests with the same token now cost ONE verification instead of five."
    - "1.57 — OPENING THE APP, AND SWITCHING COURSE, WERE DEATH BY ROUND-TRIP.
              Measured rather than guessed. A page load fired EIGHT HTTP requests — status,
              courses, workspaces, course-settings, curriculum, sessions, my/history,
              my/teams, guided/resumable — 19 database queries between them, most of it the
              same tables read over and over by endpoints that did not know about each
              other. Selecting a course fired two more, the second only to learn a count the
              first response already contained. On the cloud database every query is a
              network hop, and until 1.56 every REQUEST also re-verified the session against
              googleapis.com, so the real cost was several seconds of waiting.
              (a) GET /api/bootstrap returns everything the page needs to draw itself in one
              request, with the shared work done once: the curriculum is read a single time
              and handed to whatever needs it (_session_list now accepts the rows instead of
              re-reading them), and the team list and course counts are fetched once and
              passed to courses_for_user rather than being looked up again inside it.
              19 queries across 8 requests -> 8 queries in 1.
              (b) PER-TAB DATA IS NOW FETCHED PER TAB. History, Team and Agent-rules data was
              loaded on every sign-in although it is only ever shown inside those tabs
              (/my/teams alone is four queries). It loads when its tab is opened, and after a
              run finishes, which is when it can change.
              Requests on load, asserted by the UI harness so it cannot creep back:
              auth/config and bootstrap — two, from eight."
    - "1.58 — THE ONE CALL THAT STARTS A DOCUMENT WAS NEVER TESTED, AND IT WAS BROKEN.
              POST /api/guided/start died on every click with 'GuidedStartBody' object has
              no attribute 'course': the handler read body.course and body.team_id, and the
              edit that was to declare them on the model was lost. Every suite was green,
              because none of them go through the endpoint — the content suites call the
              pipeline directly, and the UI harness stubs the response, so the frontend was
              being tested against a server that existed only in the stub.
              (a) The fields are declared. (b) Two suites now cover the gap, and both
              reproduce the exact user-visible error when the fields are removed again:
              evals/test_api_contracts.py reads server.py's AST and fails if a handler ever
              reads a field its request model does not declare (16 handlers, no server
              needed); evals/test_endpoints.py boots uvicorn and posts real JSON to a
              throwaway database, faking only sign-in and the generation thread — and the
              thread only after the handler has returned, so body parsing, the curriculum
              lookup, budget resolution and the run row are all real.
              (c) Found by that test: GENERATION READ A PROCESS-WIDE 'SELECTED COURSE'.
              The request carried a course and the run was STAMPED with it, but the
              curriculum was loaded from one global shared by everyone signed in, so on the
              deployed server two people generating for different courses at the same time
              got each other's sessions — and a run resumed after a restart re-read
              whichever course was selected then. load_sessions() now takes the course,
              guided_start passes the one the request named, and the run carries it in its
              checkpoint so it finishes on the curriculum it began on.
              (d) Also from that live run: EVERY LIST LINE HAD TWO MARKERS. The recap and
              agenda read '1. Buffering' under a bullet glyph, because the agenda gate
              requires the model to number 1..N (mirroring the numbered Key Takeaways) and
              the renderers then wrote every line with style='List Bullet'. The renderer
              now decides: a line that numbers itself keeps its number and loses the glyph,
              anything else is bulleted as before — in the .docx, the .md and the review
              pane alike, so what a reviewer approves on screen is what is handed over.
              The model's own numbers are kept rather than Word's automatic ones, which
              continue across consecutive lists and would number the agenda 6..10 after a
              five-line recap."
  architecture:
    entrypoints: ["server.py + frontend/ (React web app — the only generation UI)",
                  "run.py (CLI: sheet setup, sync, watch, list)"]
    flow: "sheet -> validate+sync (Slides->pptx->KB) -> guided chunk generation -> human reviews/approves each chunk -> assemble -> guardrails -> time -> pages -> judge -> bounded repair -> learn surviving defects -> render .docx"
    inputs: "ONE Google Sheet (curriculum + a 'PPT Links' column of past Google Slides decks)"
    output: "Word .docx (+ .md preview + .grade.json report) in outputs/"

# ----------------------------------------------------------------------------
# MODEL / API
# ----------------------------------------------------------------------------
model:
  # Provider: "openrouter" (OpenAI-compatible HTTP) or "anthropic" (native SDK).
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"   # env var holding the key (see .env)
  # Model ids use the provider's naming. OpenRouter's Claude Sonnet slug:
  generator: "anthropic/claude-sonnet-5"   # drafting + revision
  judge: "anthropic/claude-haiku-4.5"      # LLM-as-judge grader — Haiku: ~3x faster/cheaper than Sonnet for scoring
  prompt_caching: true              # cache the large static system prompt across generate/revise/judge calls
  # OUTPUT CEILING. This caps THINKING PLUS TEXT, not just the JSON — and Claude
  # Sonnet 5 thinks by default (adaptive thinking is on whenever the request omits
  # the `thinking` field; on Sonnet 4.6 the same request did no thinking at all). A
  # real generation was observed spending 6,863 reasoning tokens before writing any
  # JSON, then hitting the old 32k ceiling with the last of five sections unwritten —
  # the whole doc lost, because a truncated response cannot be parsed. Sonnet 5's
  # ceiling is 128k; 64k leaves roughly 4x headroom over what a 16-page doc needs.
  max_tokens: 64000
  # The judge emits one score + justification per rubric dimension, plus
  # blocking_issues and suggested_fixes. 4k truncated mid-JSON at 8 dimensions; 8k
  # left only ~1.5x margin at 13 (1.29 added length_discipline, analogy_discipline
  # and example_quality), and the doc that most needs judging is exactly the one
  # with the most to say about it. Cheap on Haiku, so the margin is worth having.
  judge_max_tokens: 16000
  temperature: 0.4                  # low-ish: correctness over creativity
  # Live market + recency check via OpenRouter's ":online" web search on the JUDGE
  # call (uses this same OPENROUTER_API_KEY; small extra per-call cost). When true,
  # the judge web-verifies the market_parity and content_recency dimensions against
  # GFG/TutorialsPoint/Scaler and current standards. Set false to save cost/latency.
  enable_web_market_check: true

# ----------------------------------------------------------------------------
# HARD CONSTRAINTS  (enforced by guardrails — a run FAILS if violated)
# ----------------------------------------------------------------------------
constraints:
  recording:
    max_minutes: 40                 # absolute ceiling
    target_minutes: 36              # aim below the ceiling for safety margin
    # ---- PACING MODEL -------------------------------------------------------
    # "per_slide"  : minutes = slide_count x minutes_per_slide.  THE ACTIVE MODEL.
    # "word_count" : the original estimator (skeleton words x elaboration_factor
    #                / wpm + per-slide overhead), kept selectable.
    # Changed on the reviewer's own recording experience: a slide takes about a
    # minute and a half to record, whatever is on it, so 26 slides is 39 minutes.
    # The word-count model disagreed by roughly 2x — it read the accepted 14-slide
    # Session 30 doc as 39.8 minutes where this model reads 21 — and the person who
    # records the sessions is the calibration authority. The word-count estimate is
    # still COMPUTED and reported as `narration_minutes` so the disagreement stays
    # visible instead of being silently discarded, and a slide carrying far more
    # narration than its 1.5 minutes can hold is surfaced as a warning.
    pacing: "per_slide"
    minutes_per_slide: 1.5
    # ---- used by the word_count model, and by the density warning -----------
    speaking_words_per_minute: 130  # narration pace for time estimation
    seconds_per_slide_overhead: 15  # transition + settle time per slide
    # Every session IS a 40-minute session. The old UI toggle could switch the
    # budget off entirely (DEPTH MODE), which produced docs nobody could record and
    # contradicted the page ceiling below. The budget is now unconditional: the
    # server forces it on for one-shot and guided runs alike. Set false to hand the
    # choice back to the user (the toggle code path is intact).
    always_enforced: true
    # A TR doc is a SKELETON the instructor elaborates on when recording.
    # Calibrated against the golden Session 15 (1399 skeleton words -> ~38 min
    # recording across 8 slides). Raising this makes the 40-min gate stricter.
    elaboration_factor: 2.9
  pages:
    # LENGTH CEILING, in rendered .docx pages. Recording time alone was not enough of
    # a length gate: a comparison table costs a third of a page and almost no narration,
    # so a doc could sit inside the 40-minute budget and still run past twenty pages.
    # A page count is also what the reviewer actually reads, so it is what we gate on.
    # RAISED 16 -> 26 together with the slide ceiling, because the two are tied: a
    # slide costs 0.887 rendered pages (median across every doc generated so far), so
    # the 26 slides the 1.5-min pacing allows is ~23 pages. Leaving this at 16 would
    # have made the page gate reject every document the new slide ceiling permits —
    # the ceiling that binds must be the one that reflects a real limit, and here that
    # is the 40-minute recording budget. Target 23 keeps a revision pass room to work.
    max: 26                         # HARD ceiling — a longer doc FAILS the run
    target: 23                      # aim here, so a revision round has room to work
    # MEASURED, not assumed: median words per rendered page across every doc generated
    # so far (111,104,128,117,216,152,136 -> median 122). Used only to turn the page
    # budget into a per-slide WORD figure the model can act on — "keep this slide under
    # 0.9 pages" is not an instruction anything can follow, "about 110 words" is.
    words_per_page: 122
    # Recap + agenda + key takeaways + title/closing occupy roughly this much before any
    # slide is written, so the slides get the remainder rather than the whole ceiling.
    front_back_matter_pages: 1.5
    # Layout model of the template docx_writer renders into (python-docx default:
    # 8.5x11 page, 1.25in side / 1.0in top-bottom margins, 11pt body at 1.15 line
    # spacing with 10pt space-after). graders/page_grader.py reads ONLY these numbers,
    # so the estimator can be re-tuned here — e.g. if docx_writer's template changes —
    # without touching code.
    layout:
      usable_width_pt: 432          # 6.0in text column
      usable_height_pt: 648         # 9.0in text height
      body_font_pt: 11
      line_height_factor: 1.38      # 1.15 line spacing x Word's ~1.2 single-line height
      space_after_pt: 10            # docDefaults w:after=200 twips
      avg_char_width_ratio: 0.48    # of font size — Calibri-like body text
      bullet_indent_pt: 18          # List Bullet left indent (0.25in)
      heading1_pt: 14
      heading2_pt: 13
      heading3_pt: 12
      heading_space_before_pt: 10   # Heading 2 / Heading 3
      heading1_space_before_pt: 24
      table_row_padding_pt: 4       # cell margins on top of the row's text height
      empty_paragraph_pt: 25        # the spacer paragraphs between slides/sections
  agenda:
    # Agenda bullets must not exceed the number of key-takeaway lines.
    max_bullets_rule: "<= key_takeaways_count"
    # The agenda is an INDEX of the session, not a rewrite of it. Each item is the
    # key-takeaway line copied VERBATIM from the curriculum and numbered, so agenda,
    # section breakers and the Key Takeaways list all read identically.
    numbered: true
    text_must_equal_key_takeaway: true
    # …and the SECTION BREAKERS carry the same line. Stated in the layout rules from the
    # start but never checked, which mattered more than it looks: coverage references are
    # scoped to "the section whose name IS takeaway i", and so is the takeaway-completeness
    # check, so a section renamed by one word silently detached both from the takeaway
    # they exist to police.
    sections_named_after_takeaways: true
  recap:
    # Not a fresh 2-4 line summary: the recap reloads the PREVIOUS session's agenda —
    # every item of it — in the same "topic: subtopics" shape it had there.
    must_cover_all_prev_agenda_items: true
    format: "topic: subtopics"
  slides:
    min: 5
    # 14 -> 18 -> 26. The reviewer's pacing model is what makes 26 coherent: at
    # 1.5 minutes per slide, 26 slides is 39 minutes, inside the 40-minute ceiling
    # with a slide to spare. Under the old word-count estimator 26 slides read as
    # ~60 minutes, which is why this number could not move before.
    # 26 is therefore the number the TIME ceiling allows, and the PAGE ceiling below
    # was raised to match it — a slide costs ~0.887 rendered pages (median over
    # every generated doc), so 26 slides is ~23 pages. Content roughly doubles
    # versus 14 slides; that is the point of the change.
    max: 26
    max_rich: 26                    # depth mode adds no slides — time/pages bind
  slide_roles:
    # Every slide declares WHY it exists. This exists so the analogy and worked-example
    # rules below can be DETERMINISTIC: "only analogise a first introduction" is not
    # checkable on free text, but it is trivially checkable against a declared role.
    # The role is a planning field — it is NOT rendered into the .docx.
    required: true
    values:
      - overview                # the LANDSCAPE first: what the section covers, which
                                # types/kinds/parts exist, how they relate. No analogy.
      - concept_intro           # a concept appears here for the FIRST time
      - mechanism               # how it works: steps, internals, protocol behaviour
      - working_example         # a concrete case traced through end to end
      - comparison             # 2+ things contrasted, normally as a table
      - advantages_limitations  # benefits / drawbacks / trade-offs
      - reasoning               # why it works, why it fails, derivation
      - application             # where it shows up in the real world
      - summary                 # consolidation of what a section established
    # Guard against the obvious cheat: labelling every slide concept_intro to keep
    # writing analogies. In a real session most slides build on a concept already
    # introduced, so more than half being first-introductions means mislabelling.
    max_concept_intro_share: 0.5
    # ---- BROAD -> SPECIFIC (structural, not just advice) ------------------------
    # Sections were opening on a narrow detail — one type, one formula, one step —
    # leaving the learner to reconstruct the shape of the topic afterwards. A section
    # must now OPEN on the wide view: name the category and its types/parts, then take
    # them one at a time in the slides that follow. `overview` is the role for that
    # opening slide; `concept_intro` also qualifies, because introducing the concept
    # itself is the broadest a single-concept takeaway gets.
    require_broad_to_specific_opener: true
    section_opener_roles: ["overview", "concept_intro"]
  headings:
    # A slide `heading`/`subheading` is a LABEL, not a sentence. Hard 4-word cap,
    # enforced by guardrails and applied in DEPTH MODE too (depth adds body
    # depth, never longer headings). `title` keeps the looser phrase cap.
    max_words: 4
    title_max_words: 8
  content:
    # Slide `content` mixes SHORT PROSE and BULLETS. The old rule was "prefer bullets,
    # keep text to one framing sentence", and the result was a document that is almost
    # nothing but bullet lists — which the reviewer reads as choppy and odd, and which
    # loses exactly the connective tissue ("why this exists", "how these two relate")
    # that a bullet cannot carry. The caps below therefore allow a real short
    # paragraph, and the mix rules make one mandatory on most slides.
    # Still bounded: a paragraph is 2-3 sentences, not an essay, and the page ceiling
    # is unchanged — a slide that needs more than this needs to be two slides.
    max_words_per_text_block: 55
    max_sentences_per_text_block: 3
    no_restating_lead_in_bullets: true
    no_table_restated_as_bullets: true
    # ---- THE PARAGRAPH AND THE BULLETS MUST CARRY DIFFERENT INFORMATION --------
    # The rule above only ever caught VERBATIM repeats, and nothing on a real slide is
    # verbatim — it is paraphrase:
    #   "Interrupt-driven I/O still burdens the CPU with copying each byte; DMA lets a
    #    dedicated controller transfer data directly."
    #     · DMA controller moves data memory-to-device directly
    #     · Frees CPU from byte-by-byte copying
    # Both bullets are the sentence again in other words. Measured across every document
    # generated so far: 11% of all bullets were restating their own lead-in.
    # This is a COVERAGE failure, not a style one. The page ceiling is fixed, so every
    # repeated line is a line that cannot teach something new — the reviewer's point
    # exactly: "if you are repeating content, we will cover less information only".
    no_bullet_echoes_lead_in: true
    # Share of a bullet's distinctive words (stopwords dropped, plurals normalised) that
    # already appear in one clause of the paragraph above it. Bullet-side, not symmetric:
    # the question is whether THIS bullet adds anything, not whether the sentence was
    # consumed. 0.5 was chosen against the real corpus — every flagged case at 0.45-0.60
    # was genuine repetition ("Mutual exclusion means each resource is either available
    # or held by one process" / "Mutual exclusion: one holder per non-shareable
    # resource"), and it catches both slides the reviewer reported.
    bullet_echo_overlap: 0.5
    # ---- PROSE / BULLET MIX (added because docs came back as wall-to-wall bullets) --
    # At least this share of slides must carry a `text` block — a short paragraph that
    # frames, defines, or connects — rather than opening straight into a list.
    min_slides_with_text_share: 0.6
    # A "list" of one or two items is not a list; it is a sentence someone bulleted.
    # Short, closely-related points belong in the paragraph.
    min_bullet_items: 3
    # Bullets earn their form when the items are substantial and parallel. A list whose
    # items are all this short is keyword soup — fold it into the prose or make it a
    # table. Reported as a warning, not a hard failure: a genuine keyword list (field
    # names, port numbers) is legitimate and the judge can tell the difference.
    short_bullet_words: 4
  speaker_notes:
    # One core teaching cue + one exam/interview hook. Nothing else.
    max_sentences: 2
  analogy:
    # WHERE an analogy belongs. An analogy buys ONE thing: it makes an unfamiliar
    # concept graspable the first time it is met. Once the concept is on the table, a
    # second analogy on the advantages slide, the reasoning slide, the comparison table
    # or the worked example teaches nothing and costs pages — and 1.7's "every slide
    # must have all six fields" was manufacturing exactly those. So the rule is an exact
    # biconditional against the slide's declared `role`, not a preference:
    #   analogy present  <=>  role == concept_intro
    # A missing analogy on a first introduction FAILS; an analogy anywhere else FAILS.
    required_on_roles: ["concept_intro"]
    # `overview` is banned too: it maps the territory (the types, the parts, how they
    # relate) rather than introducing one unfamiliar idea, and an analogy for "here are
    # the four kinds of X" is decoration. The analogy belongs on the slide that first
    # explains a specific one of them.
    banned_on_roles: ["overview", "mechanism", "working_example", "comparison",
                      "advantages_limitations", "reasoning", "application", "summary"]
    # An analogy that paints a picture and leaves the mapping implicit is incomplete:
    # it must end by naming the concept it maps onto, and it must match the concept
    # STRUCTURALLY (a cycle needs a circular-dependency scene, not a queue).
    require_explicit_tie_back: true
    # Deliberately tight: these are MAPPING phrases, not illustration markers. A
    # bare "Like a school library shared by every student" is what we are rejecting,
    # so "like" on its own is not in the list.
    tie_back_connectives: ["just as", "exactly as", "just like", "in the same way",
                           "same way as", "same way that", "which is how",
                           "which is exactly how", "mirrors how", "maps onto",
                           "corresponds to"]
  voice:
    # Slide-visible text is READ, not spoken, and every slide must stand alone.
    allow_second_person: false          # reverses the old style-guide rule
    banned_second_person: ["you", "your", "yours", "youre", "yourself", "yourselves"]
    banned_filler: ["and all", "basically", "in order to",
                    "it is important to note", "needless to say"]
    # Navigational / cross-reference phrases. Banned in SLIDE-VISIBLE text only —
    # Recap / Agenda / Upcoming Session / closing are structural and may reference
    # other sessions, and speaker_notes may keep a lighter continuity voice.
    banned_navigation: ["last session", "previous session", "next session",
                        "upcoming session", "as we saw earlier", "as we discussed",
                        "as discussed earlier", "introduced earlier", "seen earlier",
                        "in the previous slide", "in the next slide", "in this slide",
                        "we will see", "we saw", "let us", "moving on",
                        "recall that", "now that we", "earlier we", "coming up"]
  worked_example:
    # A worked example is not a ritual. It EARNS a slide when the learner could follow
    # the words and still not be able to DO the thing — and it wastes one otherwise.
    # "What is a file" needs a definition and a mental model, not a traced example.
    earns_a_slide_when: >
      the takeaway involves a procedure, an algorithm, a calculation, an address or
      state translation, a sequence traced over time, or a numeric trade-off — i.e.
      something the learner must be able to EXECUTE, not merely recognise.
    omit_when: >
      the takeaway is definitional, classificatory, or terminological (what X is, types
      of X, components of X, vocabulary) — the concept slide already carries the weight,
      and an invented example only adds length.
    # A deck that is mostly examples has stopped teaching the concepts.
    max_share_of_slides: 0.3
  examples:
    # Figures inside an example must be ones a practitioner would recognise, because a
    # toy number teaches a toy mental model: base register 0x00400000 and a 4 KB page,
    # not "base = 5"; PID 4312, not "process X"; a 1500-byte MTU, not "some size".
    require_realistic_figures: true
    realism_guidance: >
      Use values with the right magnitude and shape for the domain: hex base/bound
      addresses, power-of-two page and frame sizes, real port and RFC numbers, plausible
      PIDs, byte counts, timings in ms, and standard field widths. Round toy numbers
      (1, 2, 5, 10, 100) are acceptable only as counts of things (3 processes,
      4 frames), never as addresses, sizes, or identifiers.
    # A traced example with no concrete values is not a worked example.
    min_numeric_literals: 2
    # Vague stand-ins for a real value. Matched on word boundaries, so this list is
    # deliberately narrow: a legitimate label ("Process P1", "frame 3") must never trip
    # it, and neither must ordinary prose — which is why "abc" and "bar" are NOT here
    # ("bar graph", "toolbar" are innocent) while "foo"/"xyz" have no other use.
    banned_placeholders: ["some address", "some value", "some number", "any address",
                          "any value", "arbitrary value", "address x", "value x",
                          "xyz", "foo", "lorem ipsum", "tbd"]
  coverage:
    # The most serious failure mode is a SILENTLY missing sub-concept: a syllabus line
    # like "Page Faults" implies causes (first-reference/demand-load, swapped-out,
    # copy-on-write, illegal access) and minor vs major faults — not just definition +
    # handling steps + service time.
    enumerate_sub_concepts: true
    self_check_pass: true
    deferrals_must_be_named: true
    # …and now VERIFY it instead of trusting it. 1.24 told the model to enumerate the
    # sub-concepts before writing; nothing checked that it had, so a missing sub-concept
    # still slipped through silently — the exact defect reported again. The doc must now
    # EMIT the enumeration as a `coverage_map`: for every takeaway, each exam-testable
    # sub-concept mapped either to the slide `n` that teaches it or to a named deferral.
    # Guardrails then check the map against the slides that actually exist, so "I
    # forgot one" becomes "the map says slide 9 and there is no slide 9".
    require_coverage_map: true
    min_sub_concepts_per_takeaway: 2
    # ---- NOTHING OFF THE AGENDA ------------------------------------------------
    # The agenda IS the scope. Reviewers kept finding slides on topics the session was
    # never meant to teach — interesting, adjacent, and paid for out of a budget that
    # belongs to the takeaways. The coverage_map already says which sub-concept each
    # slide teaches, so a slide NO sub-concept points at is a slide with no place on
    # the agenda: it is either mapped, or it is cut. This used to be a warning only.
    every_slide_mapped: true
    # The exceptions are the slides that legitimately serve several sub-concepts at
    # once rather than teaching one: the section's opening landscape, a contrast table,
    # and a consolidating summary.
    unmapped_slide_roles_allowed: ["overview", "comparison", "summary"]
    # ---- 100% OF EVERY KEY TAKEAWAY -------------------------------------------
    # Everything above measures the doc against the model's OWN list of sub-concepts,
    # so a promise the CURRICULUM made and the model never enumerated was invisible to
    # every gate. The sheet writes a takeaway as "Topic: item; item, item" —
    #   "2. Number Systems: Decimal notation & radix / base, Binary notation; counting
    #    in binary"
    # — and each item after the colon is owed to the learner. Each one must be taught in
    # the section for that takeaway. A line with no colon promises no items and is
    # governed by the coverage_map rules alone, exactly as before.
    takeaway_subtopics_must_be_taught: true
    # How much of a sub-topic's distinctive vocabulary must appear in its section, after
    # stopwords are dropped and plurals normalised ("buses" matches "bus"). 0.6 lets the
    # doc teach "device controllers" as "the controller's registers" without tripping,
    # while a sub-topic that is simply absent still fails.
    subtopic_token_match: 0.6
    # `deferred_to` is how a sub-concept left to a later session is NAMED rather than
    # dropped silently — it is not a release valve for a tight slide budget. A takeaway
    # whose sub-concepts are mostly deferred has been postponed, not taught, and every
    # other gate stayed green while that happened. Deferring ALL of them always fails.
    max_deferred_share_per_takeaway: 0.34
  repetition:
    # WHY THE DECKS ARE INGESTED AT ALL. Every prior session's deck is extracted into the
    # knowledge base so the new document can BUILD ON what was taught instead of teaching
    # it again — but nothing checked that: the instruction lived only in the prompt, and
    # the judge scored the no-repetition dimension without ever being shown what earlier
    # sessions actually contained. Now the taught index reaches the writer (as an
    # already-taught inventory), the judge (as grading context), and this gate.
    check_prior_decks: true
    # Deliberately narrow. "Covers the same ground" and "re-teaches" are different: the
    # curriculum legitimately revisits a topic to go deeper, and the takeaway-coverage
    # gate above REQUIRES that. So only one case is unambiguous enough to fail — a slide
    # that INTRODUCES a concept (role concept_intro) under a title an earlier session's
    # deck already used, i.e. re-running the introduction. Anything else that looks like
    # overlap becomes a warning for the reviewer and is left to the judge, which can tell
    # "goes deeper" from "says it again" and now has the material to do so.
    near_duplicate_jaccard: 0.7
    # The map is a PLANNING artifact for the graders, not lecture material — it is not
    # rendered into the .docx or the Markdown preview, so it costs no pages.
    rendered_in_docx: false
  technical:
    # TECHNICAL CORRECTNESS IS THE PRODUCT. A TR doc is copied onto slides and recorded;
    # a wrong port number, bit-width or acronym expansion is then taught to every learner
    # in the batch and is expensive to walk back. The reviewer's standing complaint is
    # that specifics were confidently wrong, so the rule is no longer "be accurate" —
    # it is a stated protocol the writer follows and the judge verifies.
    #
    # The distinction that matters: a CONCEPT stated correctly at a slightly coarser
    # grain is fine; a SPECIFIC invented to sound authoritative is not. Every concrete
    # value below is either one you are sure of, or it does not appear.
    verify_before_stating: true
    specifics_requiring_certainty:
      - "RFC / standard / IEEE numbers"
      - "port numbers"
      - "header field names, orders and bit-widths"
      - "numeric thresholds and limits (timeouts, MTUs, sizes, ranges)"
      - "acronym expansions"
      - "algorithm complexity and formulas"
      - "version numbers, and which version is current"
      - "who/what introduced something, and when"
    # What to do instead of guessing. Teaching the mechanism without a number is
    # ACCEPTABLE; teaching it with a wrong number is not. This line exists because the
    # failure mode is a model reaching for a plausible-looking figure to fill a slot.
    when_unsure: >
      state the concept, the behaviour, or the relationship WITHOUT the specific —
      "a well-known port", "a fixed-size header", "an RFC-standardised option" — and
      never substitute a plausible-sounding value. Omitting a figure costs a little
      precision; inventing one teaches something false.
    # Claims that contradict each other inside one document are the other half of this:
    # a value given on slide 4 and a different one on slide 11 means at least one is
    # wrong, and the judge is asked to check the doc against itself.
    internal_consistency: true
    # The judge already runs with live web search (model.enable_web_market_check), so
    # the specifics above are spot-checked against real sources rather than re-derived
    # from the same model that wrote them.
    judge_web_verifies_specifics: true
  language:
    variety: "Indian English"
    grammar: "must be error-free"

# ----------------------------------------------------------------------------
# REQUIRED DOCUMENT STRUCTURE  (order matters — used by structural grader)
# ----------------------------------------------------------------------------
structure:
  # Each element: id, required?, and how it must appear.
  - id: session_title
    required: true
    style: "Heading 1"
    pattern: "Session {N} : {SessionName}"
  - id: recap
    required_if: "not_first_session"
    style: "Heading 2"
    pattern: "RECAP: Session {N-1} : {PrevSessionName}"
    note: "Skip entirely for session 1."
  - id: agenda
    required: true
    style: "Heading 2"
    pattern: "Agenda for Today's Session"
    body: "bullet list, count <= key_takeaways_count"
  - id: sections
    required: true
    repeat: true
    breaker_style: "Heading 2"
    breaker_pattern: "--------------------------------------- SECTION {i}: {SectionName} ---------------------------------------"
    children:
      - id: slide
        style: "Heading 3"
        pattern: "Slide {n}: {SlideTitle}"
        fields:                     # per-slide fields, in this order
          - {label: "Heading:", required: true}
          - {label: "Subheading:", required: true}
          - {label: "Content:", required: true}
          # Required on a first introduction, FORBIDDEN on every other slide role —
          # see constraints.analogy.required_on_roles / banned_on_roles.
          - {label: "Analogy:", required: "iff role == concept_intro"}
          - {label: "Visual Guidance:", required: true}
          - {label: "Speaker Notes:", required: true}
        tables_allowed: true         # comparison/spec tables encouraged
  - id: key_takeaways
    required: true
    style: "Heading 2"
    pattern: "Key Takeaways"
    body: "mirror the session's key takeaways from the course structure"
  - id: upcoming_session
    required: true
    pattern: "Upcoming Session : {NextSessionName}"
    note: "Omit the name only if this is the final session of the course."
  - id: closing
    required: true
    pattern: "Thank You  |  All the Best"

# ----------------------------------------------------------------------------
# PEDAGOGY RULES  (fed into the generation system prompt)
# ----------------------------------------------------------------------------
pedagogy:
  - "Motivate every concept before defining it — never jump straight to a definition."
  - "Order concepts so each builds on the previous (problem -> idea -> mechanism -> comparison -> real use)."
  - "BROAD -> SPECIFIC, in that order, always. Open a section on the landscape: what
     the topic is, which types/kinds/parts it has, how they relate. Only then take
     them one at a time — what each is, where it came from, how it works, what it
     costs. A learner who meets type 3 before knowing there are four types has to
     rebuild the map afterwards."
  - "Introduce a new term only after the learner feels the gap it fills."
  - "Write in a MIX of short paragraphs and bullets. A short paragraph frames, defines
     or connects; bullets carry a genuine list of 3+ parallel, substantial items. Two
     short related points are a sentence, not a bullet list — a document that is
     nothing but bullets reads as choppy and hides how the ideas connect."
  - "Teach nothing that is not on the agenda. The key takeaways are the scope; an
     adjacent topic, however interesting, is spending the session's budget on
     something the learner was not promised."
  - "Analogise a concept ONCE, where it is first introduced. An analogy on an advantages,
     reasoning, comparison or worked-example slide adds length and no understanding."
  - "Keep the one analogy everyday and Indian-context friendly, and tie it back to the concept."
  - "Add a worked example only where the learner must be able to EXECUTE something
     (a procedure, calculation, translation or trace) — not for definitional topics."
  - "Give examples realistic figures: real base addresses, page sizes, port numbers, PIDs."
  - "Prefer a comparison table when contrasting 2+ items (e.g. TCP vs UDP)."
  - "Close each section implicitly leading into the next."
  - "Cover every key takeaway of the session AND its exam-testable sub-concepts — none
     skipped, none padded beyond scope. Spend the length budget on coverage, not ritual."

# ----------------------------------------------------------------------------
# MARKET PARITY  (content depth benchmark)
# ----------------------------------------------------------------------------
market_reference_platforms:
  - "Scaler / Scaler Topics"
  - "GeeksforGeeks (GFG)"
  - "TutorialsPoint"
  - "JavaTpoint"
  - "Standard university CN/CS syllabi"
market_rule: >
  Depth and accuracy must match or exceed these platforms for the same topic —
  correct terminology, standard values (RFC numbers, field sizes, thresholds),
  and the comparisons a learner would find there — without exceeding the
  40-minute recording budget.

# ----------------------------------------------------------------------------
# CONTEXT SOURCES  (what the agent reads to stay consistent with prior sessions)
# ----------------------------------------------------------------------------
context:
  # PRIMARY inputs are two Google Sheets the user provides as links at startup:
  #  1. course_structure  — the curriculum
  #  2. session_details    — Session Name -> Google Slides (PPT) link
  # The agent syncs both on every run, validates their templates, and ingests
  # the linked Google Slides into the persistent knowledge base (incremental).
  knowledge_base_dir: "knowledge_base"
  rag_top_k: 6                                 # relevant prior slides, retrieved for the SESSION
  # …and again per TAKEAWAY, inside that chunk's own instruction. The session-level
  # retrieval is frozen into the cached base context, so the chunk writing takeaway 4
  # was seeing prior material chosen for the session as a whole — while the overlap that
  # actually matters is always topic-specific. Retrieving against the takeaway puts the
  # nearest already-taught slides in front of the model at the moment it writes.
  rag_top_k_per_takeaway: 5
  sync_poll_seconds: 60                        # --watch mode poll interval
  sync_max_workers: 1                          # decks parsed ONE at a time — image-heavy python-pptx
                                               # decks each spike RAM, and >1 in memory OOM-kills a 512 MB
                                               # host (Render free). Slower, but the sync actually finishes.
  # Offline/dev fallbacks (used only if no sheet links are configured):
  course_structure_glob: "inputs/course/*.xlsx"
  past_ppts_glob: "inputs/past_ppts/*.pptx"
  past_docs_glob: "inputs/past_docs/*.docx"
  # Column names for the offline .xlsx fallback loader ('module' is optional).
  structure_columns:
    module: "Modules"
    topic: "Topic Name"
    session_no: "Session"
    session_name: "Session Name"
    key_takeaways: "Key Takeaways"

# ----------------------------------------------------------------------------
# SHEET TEMPLATES  (strict — a sheet that does not match is DISCARDED)
# Column names from Memory Templates/. Matching is trimmed + case-insensitive,
# but the SET must match exactly: no missing columns, no extra columns.
# ----------------------------------------------------------------------------
sheet_templates:
  match_mode: "exact_set"          # exact set of columns; trimmed, case-insensitive
  # ONE sheet, not two. The deck link used to live in a separate "Session Details"
  # sheet joined on Session Name, which meant two links to paste, two templates to keep
  # valid, and a whole class of failure where a row joined to nothing because a title
  # was edited in one sheet and not the other. The curriculum sheet now carries the
  # deck link itself in a "PPT Links" column, so a session and its deck are the same
  # row and the join cannot go stale.
  course_structure:
    label: "Course Curriculum Structure"
    required_columns: ["Topic Name", "Session", "Session Name", "Key Takeaways",
                       "PPT Links"]
    # The column holding each session's Google Slides deck. Blank for a session whose
    # deck does not exist yet — that is a session still needing a TR doc, not an error.
    ppt_link_column: "PPT Links"
  guide_file: "harness/sheet_templates.md"

# ----------------------------------------------------------------------------
# INTERFACE  (how a user drives the agent)
# ----------------------------------------------------------------------------
interface:
  web:
    tool: "react + fastapi"
    file: "server.py + frontend/"
    launch: "./start.sh"
    steps: ["Connect the curriculum sheet (validate + sync)",
            "Pick a session and generate every chunk",
            "Review each chunk — approve or regenerate with a reason",
            "Create the final TR doc, review grades + download .docx"]
  cli:
    file: "run.py"
    commands:
      - "python run.py                 # interactive setup: enter the sheet link and sync"
      - "python run.py --sync           # re-sync with the saved link, print changelog"
      - "python run.py --watch          # poll the sheet, log changes"
      - "python run.py --template-guide  # print the required sheet template"
      - "python run.py --list           # list sessions from the synced structure"
  # Generation itself is web-only and always GUIDED: every chunk is human-reviewed
  # before assembly. The one-shot mode (whole doc in a single unreviewed call) was
  # removed — it produced documents nobody had looked at until they were finished.

# ----------------------------------------------------------------------------
# QUALITY GATES  (thresholds the graders must clear to accept a doc)
# ----------------------------------------------------------------------------
gates:
  structural_pass: true             # ALL required elements present (hard gate)
  time_within_budget: true          # estimated minutes <= max_minutes (hard gate)
  pages_within_budget: true         # estimated pages <= constraints.pages.max (hard gate)
  # The LLM quality check is not optional any more. It used to be a checkbox, so a doc
  # could be produced with no rubric score at all — and an ungraded doc also skips the
  # revision loop AND the self-evolution step that turns surviving defects into durable
  # rules, so turning it off quietly disabled the agent's learning. Set false to hand
  # the choice back to the user (the use_judge code path is intact).
  always_run_llm_judge: true
  # Rebalanced 2026-07-13 from a 3-session live probe (Sessions 10/17/24 all scored
  # 100/100, every dimension 5/5). The old 85/3 bar had huge headroom — "accepted"
  # was near-automatic. Raised so acceptance means RECORDING-READY, not just "okay":
  rubric_min_total: 90              # LLM-judge weighted score out of 100 (was 85)
  rubric_min_per_dimension: 4       # every dimension >= 4/5 — no merely-"acceptable" weak spots (was 3)
  # Each generate/revise call to the model takes ~1-2 minutes. The loop now
  # ITERATES until the doc is accepted (or a round fails to improve the rubric —
  # see pipeline's convergence guard), up to this ceiling, keeping the best draft.
  max_revision_rounds: 3            # up to three repair passes; early-exit on pass/plateau (was 1)
  # Revise a clear miss (< this) once; marginal near-misses (82-89) are shipped
  # flagged-not-accepted rather than burning a slow extra round for a small delta.
  rubric_revise_below: 82           # revise only if weighted score < this (was 75)
  # GUIDED REPAIR AT FINALIZE. Guided mode drafts one section per call, so no chunk
  # review can see a property of the ASSEMBLED document — and finalize originally had
  # no repair pass at all, so an over-long guided doc came back failing three gates at
  # once with the review panel already gone: the only way forward was to pay for a
  # whole new guided run. This bounds a repair pass over the assembled doc; the
  # best-scoring draft is kept, so a repair that makes things worse can never be the
  # one that ships. Set 0 to disable.
  # 1 -> 2: one round was sized for a single length overshoot. The repetition gate can
  # report five or six offending bullets across a document at once, and a single pass
  # reliably clears some but not all of them; the second round costs one LLM call and
  # only runs when the first did not finish the job. The best draft still wins, so a
  # second pass can never ship something worse than the first.
  guided_length_repair_rounds: 2
  # WHAT the repair pass is allowed to fire on. Everything here is either a property of
  # the whole document (invisible to any single chunk review) or a defect that is not a
  # matter of the reviewer's taste at all. Ordinary quality/style opinions are still NOT
  # auto-revised — the human gated each chunk and their judgement stands.
  guided_repair_on:
    # slides / recording time / pages — the three ceilings only the assembled doc has.
    length: true
    # Any HARD guardrail failure on the assembled doc: the prose/bullet mix share, an
    # off-agenda slide, a section that opens on a detail, a broken coverage reference.
    # These are mechanical, unambiguous, and a reviewer approving chunk 3 of 6 cannot
    # see them; leaving them unrepaired means shipping a doc that failed its own gates.
    guardrails: true
    # A wrong technical specific is not a preference — it is the defect that costs most
    # once the session is recorded, and the reviewer cannot be expected to fact-check
    # every RFC number by hand. When the judge scores technical_accuracy below the
    # per-dimension bar it names the slide and the correct value in blocking_issues, and
    # this lets the repair pass act on exactly that.
    technical_accuracy: true

# ----------------------------------------------------------------------------
# REGENERATION — what happens when a reviewer rejects ONE guided chunk.
#   The reviewer's note is almost always narrow ("drop the analogy on the example
#   slide", "the base address is unrealistic"). Re-drafting the whole section from
#   that note threw away the slides they were happy with, so every regeneration was
#   a fresh roll of the dice on content that had already been approved.
#   The fix is not a stronger instruction — a prompt cannot promise that unrelated
#   text comes back identical. The model returns a PATCH naming exactly what to
#   change, and src/patcher.py applies it to the previous fragment, so anything the
#   patch does not name is preserved literally.
# ----------------------------------------------------------------------------
regeneration:
  mode: "patch"                     # "patch" (surgical) | "full" (legacy re-draft)
  # If the model's patch is missing, malformed, or empty, fall back to a full
  # re-draft rather than failing the reviewer's click. Logged, never silent.
  fallback_to_full: true
  # Guard against a "patch" that simply rewrites every slide: if a patch touches
  # more than this share of the section's slides, say so in the run log so the
  # over-broad edit is visible to the reviewer instead of looking surgical.
  warn_above_changed_share: 0.5

# ----------------------------------------------------------------------------
# SELF-EVOLUTION — the cross-run learning loop.
#   Intra-run revision (the loop above) fixes THIS doc. Self-evolution distils
#   the defects that SURVIVE the loop into short, durable rules (src/learning.py
#   -> knowledge_base/learned_rules.json) that are injected into EVERY future
#   generation (context_builder.build_guided_base). So the same class of mistake
#   is not repeated across sessions — the agent improves as it is used.
# ----------------------------------------------------------------------------
self_evolution:
  enabled: true
  # Two-tier rule scope. A learned rule is either HOUSE STYLE (how any TR doc should
  # be written — injected for every course) or SUBJECT MATTER (about one curriculum's
  # topics — injected only for that course). Scoping everything per course would make
  # a new course start from zero on house style, which is the exact repetition problem
  # this system exists to prevent; scoping nothing leaks one course's topics into
  # another. Set false to go back to injecting every rule everywhere.
  scope_rules: true
  # RULES A DETERMINISTIC GATE NOW ENFORCES. 1.29 turned three of the reviewer's
  # most-repeated corrections into hard guardrails, so injecting them as prose is
  # redundant — and actively harmful, because the judge is handed every learned rule
  # and told to put violations in blocking_issues (a hard gate). Observed live: a doc
  # whose worked-example slide had no `analogy` field at all, and which passed
  # guardrails, was failed by the judge for "Remove analogies from example sections" —
  # then that phantom defect was learned as two NEW rules. A hallucination became
  # durable policy. Matched rules are retired from injection and from judge
  # verification, but kept in the store and shown as automatically enforced.
  # `match` is ALL-of, on the rule text + the reviewer's original wording.
  gated_rules:
    - gate: "guardrails: agenda must equal the curriculum's key-takeaway lines verbatim"
      match: ["agenda", "curriculum"]
    - gate: "guardrails: analogy is forbidden on every role except concept_intro"
      match: ["analog", "example"]
    - gate: "guardrails: analogy must end with an explicit tie-back naming the concept"
      match: ["analog", "relate"]
  learn_from_judge: true            # surviving guardrail/judge/time defects (per-generation) -> durable rules
  learn_from_eval_sets: true        # eval-set FAILURES (evals/run_sets.py, System B) -> durable rules (LLM runs only)
  distill: true                     # LLM-rewrite each raw defect into a general, reusable DO/DON'T rule
  max_rules: 40                     # cap on injected rules (oldest trimmed first; also in learning.py)

# ----------------------------------------------------------------------------
# AUTH — Google Sign-In, restricted to the org domain.
#   Only @nxtwave.co.in Google accounts may log in (verified via OAuth, not just
#   typed). admin_emails see the global "all runs" dashboard; everyone else sees
#   only their own generations. Set GOOGLE_CLIENT_ID in .env (see README).
# ----------------------------------------------------------------------------
auth:
  allowed_domain: "nxtwave.co.in"
  admin_emails:
    - "khushi.jain@nxtwave.co.in"

# ----------------------------------------------------------------------------
# OUTPUT
# ----------------------------------------------------------------------------
output:
  dir: "outputs"
  docx_filename: "Session {N} _ {SessionName}.docx"
  also_write_markdown: true
  write_grade_report: true

# ----------------------------------------------------------------------------
# EVALS
#   Two layers:
#   (a) per-generation grading — guardrails + time_grader + llm_judge (rubric
#       above) run on EVERY generated doc, producing the .grade.json report.
#   (b) eval SETS — evals/sets/*.json, one per dimension, derived from the
#       "TR Doc Eval Guidelines". Each has a rubric + good/bad (polarity) cases.
#       Runner: evals/run_sets.py scores ONE generated doc against every set
#       (deterministic where exact; LLM-judge for qualitative; skips sets that
#       need inputs a single doc can't provide). Persists to evals/cases/.
# ----------------------------------------------------------------------------
evals:
  set: "evals/eval_set.yaml"              # golden + live regression cases
  sets_dir: "evals/sets"                  # per-dimension eval sets (index.json lists them)
  results_dir: "evals/cases"              # generated result reports land here
  golden: "evals/golden/session_15_golden.json"
  runner: "python -m evals.run_eval [--live]"          # golden regression / live pipeline
  sets_runner: "python -m evals.run_sets --session N [--no-llm]"  # score a doc vs all sets
  # 24 dimensions covering all 25 guidelines. status: implemented | dormant | not_implemented
  dimensions:
    - {id: curriculum_takeaway_extraction, guidelines: [1],        status: implemented,     grader: deterministic}
    - {id: ppt_extraction_completeness,    guidelines: [2, 3],     status: implemented,     grader: hybrid}
    - {id: takeaway_coverage,              guidelines: [1, 4],     status: implemented,     grader: hybrid}
    - {id: chunk_count,                    guidelines: [5],        status: implemented,     grader: deterministic}
    - {id: content_relevance,              guidelines: [6],        status: implemented,     grader: llm_judge}
    - {id: groundedness_faithfulness,      guidelines: [7],        status: implemented,     grader: llm_judge}
    - {id: feedback_regeneration_adherence,guidelines: [8],        status: implemented,     grader: llm_judge}
    - {id: self_evolution_loop,            guidelines: [9],        status: implemented,     grader: hybrid}
    - {id: recording_time_budget,          guidelines: [10],       status: implemented,     grader: deterministic}
    - {id: language_simplicity,            guidelines: [11],       status: implemented,     grader: llm_judge}
    - {id: broad_to_specific_ordering,     guidelines: [12],       status: implemented,     grader: llm_judge}
    - {id: slide_phrasing_no_meta_narration, guidelines: [13],     status: implemented,     grader: hybrid}
    - {id: analogy_quality,                guidelines: [14, 15],   status: implemented,     grader: llm_judge}
    - {id: conciseness,                    guidelines: [16],       status: implemented,     grader: hybrid}
    - {id: pedagogical_flow_continuity,    guidelines: [17],       status: implemented,     grader: llm_judge}
    - {id: no_repeat_no_future_leakage,    guidelines: [18],       status: implemented,     grader: llm_judge}
    - {id: market_coverage_completeness,   guidelines: [19],       status: implemented,     grader: llm_judge}
    - {id: content_recency,                guidelines: [20],       status: implemented,     grader: llm_judge}
    - {id: document_structure_layout,      guidelines: [21],       status: implemented,     grader: deterministic}
    - {id: document_length_pages,          guidelines: [22],       status: implemented,     grader: deterministic}
    - {id: analogy_placement,              guidelines: [23],       status: implemented,     grader: deterministic}
    - {id: worked_example_appropriateness, guidelines: [24],       status: implemented,     grader: hybrid}
    - {id: example_figure_realism,         guidelines: [24],       status: implemented,     grader: hybrid}
    - {id: regeneration_scope_discipline,  guidelines: [25],       status: implemented,     grader: llm_judge}
