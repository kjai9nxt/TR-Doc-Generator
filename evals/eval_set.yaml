# ============================================================================
#  EVAL SET
#  Regression + acceptance cases for the TR Doc Generator. Run with:
#     python -m evals.run_eval            # offline: fixture through graders
#     python -m evals.run_eval --live     # calls the API for `generate` cases
# ============================================================================

# Golden reference: the hand-verified Session 15 doc. Every grader/guardrail
# MUST pass on it. This is the offline regression anchor (no API needed).
golden:
  json: "evals/golden/session_15_golden.json"
  session_no: 15
  # PIN the curriculum the golden was written against. Without this the offline eval
  # loaded whatever course happens to be synced into knowledge_base/, so once the
  # active course changed (Computer Networks -> Operating Systems) the golden was
  # being graded against a DIFFERENT Session 15's key takeaways — and CI, which has
  # no synced cache, silently used the xlsx and disagreed with local runs.
  course_file: "Final CN Structure.xlsx"
  expect:
    guardrails_pass: true
    time_within_budget: true
    # When --live, the judge should score the golden at least this high.
    rubric_min_total: 85
  # GRANDFATHERED GATES — named, printed on every run, and NOT silently ignored.
  #
  # harness 1.24 made the agenda the verbatim numbered key-takeaway lines (one section
  # breaker each) and the recap the previous session's FULL agenda. This golden was
  # hand-written under the older rules: it groups the curriculum's 7 takeaways into 4
  # re-titled sections and recaps 3 of Session 14's 5 items. Bringing it into
  # compliance is not a text edit — it means re-authoring the reference into 7
  # sections and redistributing its 8 slides, which changes the very artifact the
  # whole system is calibrated against. That is a deliberate authoring decision, so
  # the golden is exempted from these two gates ONLY, by explicit substring, until it
  # is regenerated. Every other gate still has to pass on it.
  # Delete this block once the golden is re-authored.
  known_deviations:
    - "Agenda has 4 items but the curriculum has 7 key takeaways"
    - "was reworded. Expected the curriculum line verbatim"
    - "and key takeaway"
    - "agenda item(s) are not numbered"
    - "the recap must carry ALL of them"

# Live generation cases — exercise the full pipeline on real sessions.
generate_cases:
  - session_no: 1        # first session: recap MUST be omitted
    expect: {recap_present: false, upcoming_present: true, guardrails_pass: true, time_within_budget: true}
  - session_no: 9        # mid-course: full structure
    expect: {recap_present: true, upcoming_present: true, guardrails_pass: true, time_within_budget: true}
  - session_no: 15       # matches the golden — compare against reference
    expect: {recap_present: true, upcoming_present: true, guardrails_pass: true, time_within_budget: true}
  - session_no: 31       # final session: upcoming MAY be null
    expect: {recap_present: true, guardrails_pass: true, time_within_budget: true}

# Adversarial checks — properties every generated doc must hold.
invariants:
  - "agenda bullet count <= session key-takeaway count"
  - "estimated recording minutes <= 40"
  - "5 <= slide count <= 12"
  - "every slide has heading, subheading, and content"
  - "recap present iff session_no > 1"
  - "no analogy repeated across slides in the same doc"
