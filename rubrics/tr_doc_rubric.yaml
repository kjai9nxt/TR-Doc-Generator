# ============================================================================
#  TR DOC RUBRIC
#  Used by the LLM-as-judge grader (graders/llm_judge.py). Each dimension is
#  scored 1-5. Weighted sum is normalised to /100. Gates in harness.yaml decide
#  pass/fail.
# ============================================================================

scale:
  1: "Fails — unusable, major errors."
  2: "Weak — significant gaps or errors."
  3: "Acceptable — meets the bar with minor issues."
  4: "Strong — clearly good, negligible issues."
  5: "Excellent — recording-ready, nothing to fix."

# Each dimension tags the eval guideline(s) it enforces: [G#]. Process guidelines
# (G2/G3 extraction, G5 chunk count, G8 feedback, G9 self-evolution, G25 regeneration
# scope) are NOT scored here — they are not per-doc quality; they live only in evals/sets/.
#
# 13 dimensions, weights summing to 100. The three added in 1.29 exist because the
# reviewer's complaints were about ECONOMY, and nothing was scoring it: the doc was
# spending pages on an analogy per slide and an example per topic while sub-concepts went
# missing. So length_discipline scores whether the length was earned, analogy_discipline
# scores placement before quality, and example_quality scores whether an example was
# warranted at all. The old clarity_and_analogies dimension lost its analogy half to
# analogy_discipline and is now clarity_and_language.
#
# REWEIGHTED for the reviewer's three standing complaints — wrong technical specifics,
# content that was never on the agenda, and a document made almost entirely of bullets.
# technical_accuracy 17 -> 20 (it is the complaint that costs the most once a session is
# recorded) and pedagogy 8 -> 9 (it now carries the broad->specific rule as a scored
# criterion, not a footnote). The 4 points came off the dimensions whose defects a
# reviewer catches at a glance: analogy_discipline 7 -> 6, example_quality 6 -> 5,
# clarity_and_language 5 -> 4, market_parity 4 -> 3. Scope and the prose/bullet mix are
# scored inside coverage and slide_content_style rather than as new dimensions, because
# both already own that ground and a 14th dimension would dilute every weight.
dimensions:
  - id: technical_accuracy
    weight: 20
    question: >
      Is every fact correct AND grounded in the curriculum / known material? This is the
      heaviest dimension because the document is copied onto slides and recorded: a wrong
      specific is taught to the whole batch. CHECK THE SPECIFICS ONE BY ONE — RFC /
      standard / IEEE numbers, port numbers, header field names and bit-widths, numeric
      thresholds and limits, acronym expansions, complexities and formulas, version
      numbers, and attributions (who introduced what, when). Where web search is
      available, VERIFY them rather than judging plausibility, and say in the
      justification which ones you checked. Any incorrect or invented fact caps this at
      2 — and name it explicitly in `blocking_issues` with the slide number and the
      correct value, so the repair pass can fix exactly that line. Also check the doc
      against ITSELF: the same value, definition or acronym expansion must read
      identically everywhere it appears; two different numbers for one thing means one
      is wrong, and caps this at 2. Contradicting what an earlier session established
      caps at 2. NOTE what is NOT a defect: teaching a mechanism correctly WITHOUT a
      specific figure is the house rule when the writer is unsure — do not penalise a
      correct explanation for omitting a number, and never ask for a number to be added
      unless you can supply the verified value. [G7]
  - id: coverage
    weight: 15
    question: >
      Does the doc cover ALL of the session's key takeaways AND the standard SUB-CONCEPTS
      inside each one? A syllabus line names a topic, not its whole scope: for each
      takeaway, enumerate the sub-concepts an exam would test and check each has a slide.
      ("Page Faults" implies the causes — first-reference/demand-load, swapped-out,
      copy-on-write, illegal access — and minor vs major faults, not only definition +
      handling steps + service time.) A SILENTLY missing commonly-tested sub-concept is
      the most serious failure here and caps this at 2; a deferral named explicitly in the
      text does not. A `deferred_to` entry in the coverage_map is the REQUIRED way to
      record a sub-concept left to a later session — it is the opposite of a silent
      omission, so do NOT treat its presence as a defect or as "a false impression of
      coverage", and do not ask for it to be dropped from the map. Judge only whether the
      deferral is genuinely a later session's material and is named in the section text.
      VERIFY THE `coverage_map` RATHER THAN TRUSTING IT: does it list the
      sub-concepts an exam would actually test (not a thin restatement of the takeaway),
      and does the slide it points at really teach that sub-concept? A map that looks
      complete while a sub-concept is missing from the slides caps this at 2. Note that a
      sub-concept mapped to a slide OUTSIDE the section teaching its takeaway is now a
      deterministic guardrail failure — do not re-adjudicate it here.
      100% OF EVERY TAKEAWAY, AND THE SESSION FINISHED: the curriculum line itself names
      sub-topics (everything after the colon, split on semicolons and commas) and the
      session OWES every one of them. Walk each takeaway line item by item and confirm
      the section teaches it; a sub-topic named in the line and missing from the section
      caps this at 2. A deferral is legitimate only for material that genuinely belongs
      to a LATER session's takeaway — never for something this line names and never to
      make room for length, and a takeaway with most of its sub-concepts deferred is a
      postponed takeaway, which caps at 2.
      SCOPE, in the other direction: the agenda IS the scope. Nothing beyond the
      takeaways, no future-session topic. Read every slide and ask whether the takeaway
      it sits under genuinely promised it — an adjacent, interesting topic is spending
      the session's budget on something the learner was not promised.
      NO RE-TEACHING: the already-taught digest below the doc lists what earlier sessions
      covered, from their real decks. A slide that re-introduces or re-explains something
      on that list is repetition and caps this at 3 — but revisiting a topic to go DEEPER
      is required when the takeaway names it, so judge whether the slide starts ABOVE
      what the earlier session covered rather than penalising the overlap itself. A
      one-line reminder in the Recap is always fine.
      Missing a whole takeaway caps at 2; off-agenda content, re-teaching, or future
      leakage caps at 3 — name the offending slide in `blocking_issues` either way, so
      the repair pass can act on it. [G1,G4,G18]
  - id: pedagogy
    weight: 9
    question: >
      Sound ordering (problem -> idea -> mechanism -> comparison -> use) AND, above all,
      BROAD -> SPECIFIC. The broad->specific rule is structural: each section must open
      on the landscape — what the topic is and which types / kinds / parts / stages it
      has, named together — before any single one of them is taught in detail, and only
      then move to how each works, where it came from, and what it costs. A section that
      opens on one type, one formula or one step, or that teaches types 1..N without ever
      having named the set, caps this at 2 (the deterministic gate only checks the
      opening slide's role, so judge whether the CONTENT really sets the map). Also:
      concepts motivated before defined; terms introduced after the gap is felt; smooth
      flow with no sudden jumps (nothing used before it is taught). [G12,G17]
  - id: recording_time
    weight: 8
    question: >
      Is the session realistically recordable in <= 40 minutes (when the limit is on),
      based on the deterministic time estimate provided as ground truth? Over budget
      caps at 2. NOTE HOW THE ESTIMATE WORKS: recording is paced at ~1.5 minutes PER
      SLIDE whatever is on the slide, so the budget is spent by the SLIDE COUNT and 26
      slides is 39 minutes. Do NOT penalise a slide for carrying substantial content on
      recording-time grounds, and do NOT suggest trimming text or dropping a sub-concept
      to save recording time — trimming text buys none. The amount of text is judged
      under length_discipline (the PAGE ceiling) instead. The estimate also reports
      `narration_minutes` (the older word-count model) for comparison; it is NOT the
      gate. `dense_slides`, if present, lists slides whose narration alone would run well
      past 1.5 minutes — worth a note, not a failure. [G10]
  - id: length_discipline
    weight: 8
    question: >
      Is the document within the 26-page ceiling (target ~23), per the deterministic page
      estimate given as ground truth — and, more importantly, is its length EARNED? Use
      `pages_by_part` to tell the two apart: length spent on sub-concepts, worked detail
      and comparison tables is earned; length spent on content that is not on the agenda,
      analogies outside first introductions, examples the topic did not need, bullets
      restating a table or their own lead-in, or filler is not. Note that the framing
      PARAGRAPHS are earned length, not padding — the prose/bullet mix is a house rule,
      so never treat "this could have been bullets" as a length defect. Over the ceiling caps
      this at 2. Within the ceiling but padded (any of the above present) caps at 3. A doc
      that came in short by DROPPING a sub-concept caps at 1 — cutting coverage to make
      length is the worst possible trade, and should also cap `coverage`. [G22]
  - id: slide_content_style
    weight: 8
    question: >
      Does slide CONTENT read as tight slide text, not spoken narration — and is it a
      MIX of short paragraphs and bullets rather than wall-to-wall bullets? The mix is a
      house rule: a short `text` paragraph frames, defines or connects (<= 55 words, 2-3
      sentences), bullets carry a genuine list of 3+ parallel substantial items (<= 12
      words each), and tables carry any 2+ way comparison. A document that is almost
      entirely bullet lists caps this at 2 — it reads as choppy and loses the connective
      reasoning a bullet cannot carry. A one- or two-item bullet list (a sentence that was
      bulleted) caps at 3, as does a slide that opens straight into a list with no
      framing sentence. In the other direction, a 90-word essay paragraph as slide
      content caps at 2 (in depth mode too). No redundancy: bullets must not
      restate their lead-in sentence, and must not restate a table on the same slide.
      Slide-visible text must carry NO second person ("you"/"your") and NO navigational
      phrases ("last/previous/next session", "as we saw earlier", "in the previous/next
      slide", "in this slide we will", "now let us", "moving on") — every slide stands
      alone, and Recap/Agenda/Upcoming/closing are the only places a cross-reference is
      allowed. No filler ("and all", "basically"). Bullets <= 12 words; every slide
      heading/subheading a 3-4 word label (5+ words caps this at 2). Every block stays
      on-topic for its slide (no tangents). [G6,G13,G16]
  - id: analogy_discipline
    weight: 6
    question: >
      Is every analogy in the right PLACE, and is each one good? PLACEMENT is exact and
      comes first: an analogy belongs on a `concept_intro` slide (a concept's first
      appearance) and NOWHERE else. An analogy on a mechanism, comparison,
      advantages_limitations, reasoning, application, summary or working_example slide is
      decoration that costs page space and teaches nothing — each one caps this at 2. A
      first-introduction slide with no analogy also caps at 2. Check the roles themselves
      are honest: if slides that merely explain, compare or apply an already-introduced
      concept are labelled `concept_intro` so they can keep an analogy, cap at 2. QUALITY,
      for the analogies that do belong: simple, everyday, relatable, one clean mapping,
      1-2 sentences, no domain reused across slides, and it must CORRELATE rather than
      illustrate — ending with an explicit tie-back naming the concept ("<everyday scene>
      — just as / exactly as <how the concept works>") and matching the concept
      STRUCTURALLY (a cycle needs a circular-dependency scene, not a queue). A missing
      tie-back or a structural mismatch caps at 3. [G14,G15,G23]
  - id: example_quality
    weight: 5
    question: >
      Are worked examples WARRANTED, and are their figures REALISTIC? Warranted means the
      learner must be able to EXECUTE something — a procedure, algorithm, calculation,
      address or state translation, traced sequence, numeric trade-off. An example
      manufactured for a definitional, classificatory or terminological topic ("what a
      file is", "types of scheduling") is padding and caps this at 2; so does a topic that
      clearly NEEDED a traced example and got only prose. Realistic means figures a
      practitioner would recognise, at the right magnitude and shape for the domain: hex
      base/bound addresses, power-of-two page and frame sizes, real port and RFC numbers,
      plausible PIDs, byte counts, ms timings. Toy values used as addresses, sizes or
      identifiers ("base = 5"), or any placeholder ("some address", "value X", "xyz"), cap
      this at 2. Round numbers as COUNTS of things ("3 processes", "4 frames") are fine.
      An example that states a result without tracing the steps caps at 3. [G24]
  - id: clarity_and_language
    weight: 4
    question: >
      Easy to understand on first read? Are speaker notes <= 2 sentences — one teaching
      cue plus one exam/interview hook, with no restatement of the slide body and no
      "close by…"? Is jargon explained on first use, and the language plain and concrete?
      [G11]
  - id: content_recency
    weight: 5
    question: >
      Is the content up to date? No deprecated/superseded standard or version presented
      as current (e.g. SSL for TLS, "HTTP/1.1 is the latest", Python 2 for new work).
      Legacy items, if mentioned, are labelled as legacy. Presenting outdated info as
      current caps this at 2. [G20]
  - id: format_compliance
    weight: 6
    question: >
      Exact layout IN ORDER: session title; recap = ALL of the previous session's agenda
      items in its "topic: subtopics" format (omitted only for Session 1); agenda; one
      section breaker PER agenda item in agenda order; key takeaways; upcoming session
      name; closing "Thank You | All the Best". The agenda must be NUMBERED 1..N and each
      item must be the curriculum's key-takeaway line VERBATIM — identical to key takeaway
      i, not summarised or reworded (these lines are exempt from every word cap, so a long
      one must still be copied whole). A reworded agenda item, an unnumbered agenda, or a
      recap missing any of the prior session's agenda items caps this at 2. EVERY slide
      must carry `role`, heading, subheading, content, visual_guidance and speaker_notes;
      `analogy` is present iff role == concept_intro (scored under analogy_discipline).
      `coverage_map` must be present, one entry per takeaway in order with the takeaway
      copied verbatim. A missing slide field, a missing/invalid coverage_map, or a
      wrong-order/missing section caps this at 2.
  - id: market_parity
    weight: 3
    question: >
      Does depth/accuracy match or exceed Scaler, GeeksforGeeks, TutorialsPoint, and
      standard syllabi for this topic? Nothing important for the topic is missing. [G19]
  - id: language_quality
    weight: 3
    question: >
      Grammar, spelling (Indian English), consistent terminology, no filler. [G11]

output_contract: |
  Return JSON:
  {
    "scores": { "<dimension_id>": {"score": <1-5>, "justification": "<str>"}, ... },
    "weighted_total": <0-100>,
    "blocking_issues": ["<str>", ...],   // must-fix before acceptance
    "suggested_fixes": ["<str>", ...]    // actionable, for the revision pass
  }
